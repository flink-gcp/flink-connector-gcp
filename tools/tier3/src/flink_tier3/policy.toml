# Reviewed deployment policy. Changes require the same review as lifecycle code.

[environment]
project = 'flink-gcp'
region = 'us-central1'
context = 'gke_flink-gcp_us-central1_flink-tier3'
system = 'tier3-system'
smoke = 'tier3-smoke'
operator = 'flink-kubernetes-operator'
evidence = 'flink-gcp-tier3-evidence'
state = 'flink-gcp-tier3-smoke'
environment = '_control/environment.json'
gar = 'us-central1-docker.pkg.dev/flink-gcp/flink-tier3/'
repository = 'flink-gcp/flink-connector-gcp'
pricing_reviewed = '2026-09-14T00:00:00Z'
cloudtasks = 'tier3-cloudtasks'
benchmark = 'flink-gcp-cloudtasks-benchmark'
bigquery = 'tier3-bigquery'
bigquery_state = 'flink-gcp-tier3-bigquery'
pubsub = 'tier3-pubsub'
pubsub_state = 'flink-gcp-tier3-pubsub'

# Conservative normal-capacity rates, including for Spot.
# Exceed published Iowa Autopilot prices reviewed on 2026-09-14.
[cost_rates]
cpu = "0.10"
memory = "0.02"
ephemeral-storage = "0.001"

[ceilings]
seconds = 3600
cleanup_seconds = 900
# At most five Pods observed at once: the four that run, and one replacement
# slot. This count is flat over the inventory; the per-namespace quota, not
# this number, decides where that slot may be spent.
pods = 5
pvcs = 0
state_bytes = 1073741824
state_objects = 10000
log_bytes = 104857600
evidence_bytes = 104857600
additional_cost_usd = "1.00"

[pod_resources.smoke]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "1Gi"

# One Operator, supervisor, JobManager and two TaskManagers. A trial selects
# its cost ceiling through the reviewed proposal schema, up to USD 10.
[bigquery_ceilings]
seconds = 5400
cleanup_seconds = 900
# Three application Pods and two control Pods run, and `tier3-system` admits
# one replacement while the Pod it replaces terminates.
pods = 6
pvcs = 0
state_bytes = 1073741824
state_objects = 10000
log_bytes = 104857600
evidence_bytes = 104857600
# The four allowances below partition `evidence_bytes`, so what the run may
# retain is visible as a sum rather than as literals spread across modules.
receipt_bytes_supervisor = 83886080
receipt_bytes_runner = 8388608
query_bytes = 10485760
artifact_bytes = 2097152
additional_cost_usd = "10.00"

# Pub/Sub internal approval policy: three running Flink Pods plus one
# terminating replacement; two control Pods plus an Operator replacement.
# The selected dollar cap is a proposal, not an estimate or billing guard.
[pubsub_ceilings]
seconds = 3600
cleanup_seconds = 900
pods = 7
pvcs = 0
state_bytes = 1073741824
state_objects = 10000
log_bytes = 104857600
evidence_bytes = 104857600
additional_cost_usd = "10.00"

[pod_resources.operator]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "1Gi"

# Large enough that the scheduler cannot squeeze the supervisor into the
# remains of a busy node, where a system Pod then preempts it within half a
# minute. Autopilot provisions capacity for this shape instead.
[pod_resources.supervisor]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "128Mi"

[recovery]
records = 12000
records_per_second = 10
repetitions = 1
startup_seconds = 600
recovery_seconds = 300

# Cloud Tasks measurement sessions (#1246). One session executes an ordered
# list of measurement cells under one environment lock. The queue name is
# derived from the run ID; project IAM does not enforce the prefix, so the
# runtime checks the exact approved name before every queue operation.
[cloudtasks]
queue_prefix = 'ct1246-'
# RFC 6761 reserves .invalid; the paused queue never dispatches a task.
target = 'https://ct1246.invalid/task'
cell_startup_seconds = 600
cell_teardown_seconds = 180
# Flink restarts a failed cell job this many times before it fails; each
# restart gives every subtask a fresh per-creator attempt allowance.
restart_attempts = 3
# Cloud Tasks bills API operations after a monthly free allowance. Planning
# figure from the published price list; confirm it at execution approval.
task_operation_usd_per_million = "0.40"

# Session ceilings. The approval embeds these values byte for byte; a cell
# list whose derived expectations exceed them is refused before admission.
[cloudtasks_ceilings]
session_seconds = 18000
cleanup_seconds = 900
pods = 5
pvcs = 0
cells = 20
task_creations = 12000000
admin_write_ops = 6
read_ops = 60000
dispatches = 0
state_bytes = 1073741824
state_objects = 20000
log_bytes = 104857600
evidence_bytes = 4294967296
receipt_bytes_supervisor = 268435456
receipt_bytes_runner = 33554432
additional_cost_usd = "10.00"

# One JobManager and one TaskManager per cell; the TaskManager holds every
# slot of the cell's parallelism class.
[cloudtasks_pod_resources.jobmanager]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "1Gi"

[cloudtasks_pod_resources.taskmanager.p1]
cpu = "1"
memory = "4Gi"
ephemeral-storage = "1Gi"

[cloudtasks_pod_resources.taskmanager.p4]
cpu = "2"
memory = "8Gi"
ephemeral-storage = "2Gi"

[cloudtasks_pod_resources.taskmanager.p16]
cpu = "4"
memory = "16Gi"
ephemeral-storage = "4Gi"
