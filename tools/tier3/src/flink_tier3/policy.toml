# Reviewed deployment policy. Changes require the same review as lifecycle code.

[environment]
project = 'flink-gcp'
region = 'us-central1'
context = 'gke_flink-gcp_us-central1_flink-tier3'
system = 'tier3-system'
smoke = 'tier3-smoke'
operator = 'flink-kubernetes-operator'
evidence = 'flink-gcp-tier3-evidence'
state = 'flink-gcp-tier3-smoke'
environment = '_control/environment.json'
gar = 'us-central1-docker.pkg.dev/flink-gcp/flink-tier3/'
repository = 'flink-gcp/flink-connector-gcp'
# When the rates below were checked: the basis of the estimate the owner
# approves before a dispatch, not an admission deadline (ADR-0165).
pricing_reviewed = '2026-09-14T00:00:00Z'
cloudtasks = 'tier3-cloudtasks'
cloudtasks_state = 'flink-gcp-tier3-cloudtasks'
bigquery = 'tier3-bigquery'
bigquery_state = 'flink-gcp-tier3-bigquery'
pubsub = 'tier3-pubsub'
pubsub_state = 'flink-gcp-tier3-pubsub'
bigtable = 'tier3-bigtable'
bigtable_state = 'flink-gcp-tier3-bigtable'

# Conservative normal-capacity rates, including for Spot.
# Exceed published Iowa Autopilot prices reviewed on 2026-09-14.
[cost_rates]
cpu = "0.10"
memory = "0.02"
ephemeral-storage = "0.001"

# Each scenario's run, from admission to the end of its cleanup reserve. The
# ResourceQuotas, not a count here, bound what a run may hold.
[windows]
smoke = 3600
bigquery-recovery = 5400
pubsub-recovery = 3600
cloudtasks-recovery = 5400
bigtable-recovery = 5400

# The last seconds of every window, reserved for cleanup.
[cleanup]
seconds = 900

# The most state objects one listing returns before cleanup refuses.
[state]
objects = 10000

[pod_resources.smoke]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "1Gi"

[pod_resources.operator]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "1Gi"

# Large enough that the scheduler cannot squeeze the supervisor into the
# remains of a busy node, where a system Pod then preempts it within half a
# minute. Autopilot provisions capacity for this shape instead.
[pod_resources.supervisor]
cpu = "1"
memory = "2Gi"
ephemeral-storage = "128Mi"

