[project]
name = "flink-tier3"
version = "0.1.0"
description = "Bounded Tier-3 lifecycle and foundation tooling"
requires-python = ">=3.11"
dependencies = [
    "google-auth==2.58.0",
    "google-cloud-storage==3.14.1",
    "kubernetes==36.0.3",
    "requests==2.34.2",
    "urllib3==2.7.0",
    "pyyaml==6.0.3",
]

[project.scripts]
flink-tier3 = "flink_tier3.cli:main"

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"
