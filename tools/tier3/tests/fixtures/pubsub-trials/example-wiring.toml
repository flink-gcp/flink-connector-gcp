# Example trial for tests. It exercises the version 3 trial schema, the
# approval phrase and the approval-bound rendering. It lives outside
# kubernetes/lifecycle/pubsub-trials/ so that no dispatch can name it: once
# admission opens, a file there is a runnable trial. The campaign's trials are
# committed there once #1434 preregisters them and their numbers, and each
# needs its own dispatch approval.

version = 3
trial = "rescale-out"
entry_point = "datastream"
records_per_subscription = 1000
total_request_limit = 100000

[traffic_limits]
publish_calls = 20000
pull_calls = 2000
input_messages = 20000
input_bytes = 2560000
output_messages = 200000
pubsub_requests = 30000
evidence_bytes = 67108864
