# Example trial for tests. It exercises the version 5 trial schema and the
# dispatch's rendering and approval binding. It lives outside
# kubernetes/lifecycle/pubsub-trials/ so that no dispatch can name it: a file
# there is a runnable trial, and the campaign's four trials are the files there.

version = 5
trial = "rescale-out"
entry_point = "table"
records_per_subscription = 1000

