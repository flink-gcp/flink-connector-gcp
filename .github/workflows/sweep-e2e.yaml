name: Sweep E2E leftovers

# Returns every billed E2E fixture to its idle state (issue #246): deletes
# Bigtable and Spanner instances, and stops the fixed App Engine version used
# by Cloud Tasks.
#
# Bigtable and Spanner sweep at the start of each gated class, and the App
# Engine lifecycle wrapper stops its version after use. Those guards cannot run
# after a killed runner, cancelled job or process crash. At $0.65 a node-hour a
# leaked Bigtable instance is ~$109 over seven days, and a manual-scaling App
# Engine instance is also billed while serving. This scheduled workflow is the
# hard-cancellation fallback for all three resource types.
#
# The interval is a priced knob. A leak costs the two-hour staleness threshold
# plus the wait for the next sweep, which at $0.65 a node-hour is about $3 at
# this cadence. Below about two hours the threshold dominates the total and
# further frequency buys almost nothing, which is where this stops; ADR-0119
# prices the whole range rather than repeating it here. The repository being
# public is what makes the added runs free; each takes about half a minute.
# Detection of everything a sweep cannot foresee is a separate question (a
# billing budget; see the issue), deliberately not answered here. The cleanup
# needs no billing permissions or account identifier here.
#
# No Maven, no JDK: the sweep is a shell script over gcloud. It reads instance
# prefixes and thresholds from Java and the App Engine identifiers from
# OpenTofu, so the cleanup paths cannot drift apart.
on:
  schedule:
    # Every three hours, off the hour and the half hour like every other
    # schedule here. These slots miss e2e.yaml's Saturday window (01:17 plus a
    # 60-minute ceiling) by arithmetic rather than by design, and a scheduled
    # run that drifts could still overlap one. That is safe: what keeps this
    # from deleting a running E2E instance is the two-hour staleness threshold,
    # never the timetable, which is also why workflow_dispatch can fire at any
    # time of day. The coupling that would break it is raising the
    # integration-test fork's default ceiling past two hours. The CI job has a
    # separate whole-job bound, but a gated class invoked through
    # default-test after clearing the gated exclusion, or through an IDE, does
    # not inherit the fork ceiling and can cross the age gate. This guarantee
    # also does not cover --all: the workflow-run path and a manual dispatch
    # with all selected deliberately drop the comparison.
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Delete every instance with the owned prefix, whatever its age
        type: boolean
        default: false


  # A schedule is best effort: GitHub's own documentation says queued jobs may
  # be dropped under load, and this repository's slots have started 38 to 91
  # minutes late. So the sweep also runs the moment the workflow that creates
  # the fixtures finishes, in every terminal state - success, failure and
  # cancellation - which is what `types: [completed]` means.
  #
  # A finalising step inside the E2E job would be cheaper and would not need
  # the WIF binding widened, but it dies with its job, and hard cancellation is
  # exactly what this sweep exists for. A separate run outlives that, and a
  # runner that disappears entirely.
  #
  # No loop: E2E does not trigger on this workflow's completion.
  workflow_run:
    workflows: [E2E]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    # Scheduled workflows are inherited by forks; a fork could not authenticate
    # anyway (the provider condition pins the repository and owner IDs), but
    # this keeps them from trying. The immutable ID of
    # flink-gcp/flink-connector-gcp, not the owner name: a transfer or a rename
    # changes the name and would switch a name guard off silently.
    if: github.repository_id == '1305440656'
    name: Clean up billed E2E fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same provider and service account as e2e.yaml, and no OpenTofu
      # change was needed for this workflow: the binding in e2e-sa.tf is on
      # repository_id:event_name:ref, so it admits schedule and
      # workflow_dispatch on main whatever the workflow is called. The account
      # holds project-wide roles/bigtable.admin, roles/spanner.editor and
      # roles/appengine.serviceAdmin, which let it perform these cleanups.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions-e2e@flink-gcp.iam.gserviceaccount.com
          project_id: flink-gcp

      # Installed rather than taken from the runner image, for the reason
      # mise.toml gives for pinning shellcheck: an image migration must not
      # change what CI runs, and "gcloud happens to be preinstalled" is exactly
      # the kind of thing an image migration changes.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just

      - name: Sweep
        env:
          BIGTABLE_IT_PROJECT: flink-gcp
          CLOUDTASKS_IT_PROJECT: flink-gcp
          SPANNER_IT_PROJECT: flink-gcp
        # --all after E2E, or when a human ticks the box: that workflow has
        # finished, so anything still
        # carrying the owned prefix is a leak, and the age threshold would skip
        # exactly the instances this run just left behind (issue #966). On a
        # schedule the threshold stays, because some other run may be in flight
        # and age is the only thing that tells the two apart.
        #
        # The accepted risk is a local gated run in flight when the weekly E2E
        # finishes: it loses its instance and fails loudly. Minutes a week,
        # against a post-E2E sweep that would otherwise reclaim nothing.
        #
        # `inputs.all` and not `github.event.inputs.all`: the latter is the
        # string "false" on an unchecked box, and a non-empty string is truthy
        # in a GitHub expression, so it would delete everything every time.
        run: >-
          just sweep-e2e
          ${{ (github.event_name == 'workflow_run' || inputs.all) && '--all' || '' }}
