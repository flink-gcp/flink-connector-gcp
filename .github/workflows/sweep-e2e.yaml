name: Sweep E2E leftovers

# Deletes the instances an E2E run abandoned (issue #246), for both services
# whose gated suites provision one: Bigtable and Spanner.
#
# Each suite's Abstract*RealGcpITCase sweeps at the start of a gated class,
# which is enough while runs finish. It is not enough when one does not: a
# killed runner, a cancelled job or a JVM crash after @BeforeAll leaves an
# instance standing, and the only thing that schedules a gated class is
# e2e.yaml, weekly. At $0.65 a node-hour a leaked Bigtable instance is ~$109
# over seven days, and two gated classes run per execution — the number this
# workflow exists to bound, and a property of the sweep-on-next-run design
# rather than of anything Bigtable does. A leaked 100-processing-unit Spanner
# instance is an order of magnitude cheaper and swept by the same schedule.
#
# Daily, so the worst case is ~$15 rather than ~$109. Detection of everything a
# sweep cannot foresee is a separate question (a billing budget; see the issue),
# deliberately not answered here: this needs no billing permissions, no API
# enablement and no account identifier in the repository, which is why it lands
# first.
#
# No Maven, no JDK: the sweep is a shell script over gcloud. It reads the
# instance prefix and the staleness threshold out of the Java source, so the
# two sweeps cannot drift apart.
on:
  schedule:
    # Daily, and off the hour and the half hour like every other schedule
    # here. Clear of e2e.yaml's Saturday 01:17 slot plus its 60-minute ceiling,
    # but that is tidiness rather than the safety property: what keeps this
    # from deleting a running E2E instance is the two-hour threshold, which
    # holds for a workflow_dispatch run at any time of day too. The coupling
    # that would break it is raising e2e.yaml's timeout-minutes past two hours,
    # which is why the note beside that ceiling says what depends on it.
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    # Scheduled workflows are inherited by forks; a fork could not authenticate
    # anyway (the provider condition pins the repository and owner IDs), but
    # this keeps them from trying.
    if: github.repository_owner == 'laughingman7743'
    name: Delete abandoned E2E instances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same provider and service account as e2e.yaml, and no OpenTofu
      # change was needed for this workflow: the binding in e2e-sa.tf is on
      # repository_id:event_name:ref, so it admits schedule and
      # workflow_dispatch on main whatever the workflow is called. The account
      # holds project-wide roles/bigtable.admin and roles/spanner.editor, which
      # is what lets it delete.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions-e2e@flink-gcp.iam.gserviceaccount.com
          project_id: flink-gcp

      # Installed rather than taken from the runner image, for the reason
      # mise.toml gives for pinning shellcheck: an image migration must not
      # change what CI runs, and "gcloud happens to be preinstalled" is exactly
      # the kind of thing an image migration changes.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just

      - name: Sweep
        env:
          BIGTABLE_IT_PROJECT: flink-gcp
          SPANNER_IT_PROJECT: flink-gcp
        run: just sweep-e2e
