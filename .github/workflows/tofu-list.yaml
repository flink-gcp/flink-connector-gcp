name: List OpenTofu targets

# Reusable job shared by tofu-plan.yaml and tofu-apply.yaml: tfaction's
# list-targets action diffs the change against the root modules declared by
# tfaction.yaml markers and returns the ones affected, which the callers fan
# out over as a matrix. GCP, Kubernetes bootstrap and Operator have separate state
# and are selected independently by their changed root-module files.
on:
  workflow_call:
    outputs:
      targets:
        description: JSON array of changed root module targets
        value: ${{ jobs.list.outputs.targets }}

permissions: {}

jobs:
  list:
    name: List targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # list-targets resolves the pull request (changed files on
      # pull_request, the merged PR on push) through the API.
      pull-requests: read
    outputs:
      targets: ${{ steps.list-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List targets
        id: list-targets
        uses: suzuki-shunsuke/tfaction@07a983968cbace490e9059103a7019a638c65e10 # v2.3.3
        with:
          action: list-targets
