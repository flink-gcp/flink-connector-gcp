name: Verify

# The Maven half of CI: module selection, the build with its unit and
# integration tests, and the unconditional checker jobs. On pull requests it
# runs as a reusable workflow called by ci.yaml, whose `CI passed` gate is the
# one check branch protection requires; a failed job here fails this workflow,
# and that is what the gate sees. On pushes to main and manual dispatches it
# runs standalone.
on:
  workflow_call:
  push:
    branches:
      - main
    # Changes that cannot affect the Maven build skip it: a tofu or docs-note
    # merge otherwise pays runner minutes for nothing (raised by the owner on
    # #176/#178, right after a billing cut — private-repo minutes are metered).
    # paths-ignore rather than paths: everything else must keep running this.
    # READMEs, AGENTS.md and CLAUDE.md files are here because apache-rat excludes exactly
    # those patterns (see the root pom), so skipping them cannot hide a missing
    # licence header; docs/ markdown is deliberately NOT here, because rat does
    # scan it and this workflow is its only pre-merge check.
    #
    # This filter exists on push only. Pull requests arrive through ci.yaml,
    # which carries no filter at all — a required check that never reports
    # never turns green — and the changes job below decides what to build;
    # scripts/ci-maven-args.py applies this same ignore list as its first
    # rule. Keep the two lists in sync.
    paths-ignore:
      - 'opentofu/**'
      - 'tfaction-root.yaml'
      - '.github/workflows/tofu-plan.yaml'
      - '.github/workflows/tofu-apply.yaml'
      - '.github/workflows/tofu-list.yaml'
      - '**/README.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.serena/**'
      - '.mcp.json'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

# No concurrency group here: inside a workflow_call, github.workflow is the
# caller's name, so a group defined here would collide with every sibling
# ci.yaml calls and they would cancel each other. ci.yaml owns concurrency
# for pull requests; pushes to main are rare enough to run unmanaged.

permissions:
  contents: read

jobs:
  # Decides what the build job runs (issue #243): a pull request builds the
  # modules its changes affect instead of the whole reactor — a full-reactor
  # run costs ~8 minutes of wall clock (measured on PR #241, 2026-08-01, one
  # run; the module breakdown is on the issue), most of it in modules a
  # typical change never touches — and billed minutes go down with it. Pushes
  # to main and manual dispatches always build everything, so a mis-derived
  # subset can never let a module rot on main.
  #
  # The decision lives in one place, scripts/ci-maven-args.py, which derives
  # the module mapping from the poms; `just ci-maven-args --diff origin/main`
  # reproduces it by hand. The changed-file list comes from git alone: a
  # third-party changed-files action (dorny/paths-filter) was tried first and
  # removed on this pull request — weighed with the owner against
  # tj-actions/changed-files' CVE-2025-30066 supply-chain compromise, a
  # changed-file provider is third-party code and an extra pull-requests:read
  # permission this job simply does not need, since the checkout already
  # carries the answer. What the action's API pagination bought only matters
  # past GitHub's 3000-file response cap, far beyond anything this repository
  # sees.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_build: ${{ steps.derive.outputs.run_build }}
      lanes: ${{ steps.derive.outputs.lanes }}
      check_notice_sources: ${{ steps.derive.outputs.check_notice_sources }}
    steps:
      # A pull_request checkout is the base-into-head merge commit
      # (refs/pull/N/merge); fetching its two parents as well (depth 2) makes
      # HEAD^1 the current base tip, so `--diff HEAD^1` below is exactly the
      # net change merging this pull request would apply.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      # No setup-python for the deriver: unlike the tomllib scripts below, it
      # needs nothing newer than any runner image's python3, and this job sits
      # on every pull request's critical path.
      - name: Derive the Maven arguments
        id: derive
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            just ci-maven-args --diff 'HEAD^1' >> "$GITHUB_OUTPUT"
          else
            just ci-maven-args --full >> "$GITHUB_OUTPUT"
          fi

  # Java sources only: spotless and checkstyle run inside `verify`. scripts/ and
  # anything else Maven does not see are linted by lint.yaml.
  # A matrix over the lanes the changes job derived: one per connector the selection
  # builds, so an ordinary single-connector pull request is still one runner. Separate
  # runners rather than -T inside one, because -T made every module three to four times
  # slower at once (measured, #453) -- runners do not share cores. fail-fast is off so a
  # failure in one lane still reports the others.
  build:
    name: Build and test (${{ matrix.lane.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    # Emptiness tested directly rather than through run_build: an empty matrix vector is
    # a workflow-level error, not a skipped job, and a workflow that errors never reports
    # -- the shape verify_passed exists to prevent. tofu-plan.yaml guards the same trap
    # the same way.
    if: needs.changes.outputs.lanes != '[]'
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      # Not setup-java's `cache: maven`, which stood here before: its key is a
      # hash of the POMs and it carries no restore-keys, so every pull request
      # that edits a pom.xml misses completely and re-downloads the whole
      # dependency tree. Measured on the full reactor 2026-08-15: 11:10 warm
      # against 14:33 cold. A prefix fallback turns that miss into a near-hit —
      # the changed dependency is fetched, everything else is restored.
      #
      # The path is docs.yaml's, for the reasons stated there: ~/.m2/wrapper joins
      # it because the wrapper is `distributionType=only-script`. The negation
      # line was written to keep a cached SNAPSHOT of this project's own
      # artifacts from satisfying a resolution that should have come from the
      # reactor — but see the measured note below the restore step: it does not
      # actually exclude anything. What keeps the cache clean is that
      # `just verify` runs `mvn verify`, which installs nothing.
      #
      # Restore always, save only on the default branch. A cache written from a
      # pull request is scoped to that pull request's ref, so no other branch can
      # ever read it — while it still counts against the repository's 10 GB quota
      # and evicts, by least-recently-used, the caches on main that every pull
      # request *does* read. Measured 2026-08-15: 9.14 GB of the 10 GB used, of
      # which six pull-request-scoped Maven entries held 2108 MiB between them.
      # Saving only on main removes that eviction pressure; a pull request keeps
      # the restore, which is the half that saves the download.
      # The io/github/flink-gcp negation below is a no-op for what the archive
      # contains, measured at the pinned action's dist on 2026-08-31: paths
      # resolve with implicitDescendants=false, ~/.m2/repository itself is the
      # manifest entry, and tar archives it recursively — a subdirectory
      # negation removes nothing. That is currently harmless in both
      # directions: no verify lane installs this group (nothing writes a
      # SNAPSHOT to exclude), and the one thing that does land there — the
      # released japicmp reference, downloaded from Central during the run —
      # is immutable and exactly what ADR-0124's deferred cache decision
      # wanted kept (issue #728 records the measurement). If a lane ever
      # gains an install step, this negation will not protect it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: maven_cache
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/io/github/flink-gcp
          key: maven-verify-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-verify-

      # install-action rather than mise: this drops one binary on PATH and
      # creates no shims at all, which is the simplest thing that can work in a
      # job that also runs setup-java. mise would work too — mise.toml pins java
      # and maven, so its shims lead the JDK by default, but add_shims_to_path:
      # false turns that off. install-action is preferred here for having
      # nothing to turn off, not because the two cannot be combined.
      #
      # `tool: just` carries no version on purpose. install-action reads no
      # version file, so pinning it would mean an inline version in six places
      # to keep in sync with mise.toml — and the reason shellcheck *is* pinned
      # (a newer release adds checks that fail a pull request which changed
      # nothing) has no analogue here: just guarantees no 1.x release breaks an
      # existing justfile or a working command line, and that there will never
      # be a 2.0. mise.toml says `just = "1"`, so both sides mean the same
      # thing. The guarantee covers stable features only, which is why nothing
      # CI runs uses a `--unstable` one — see the lint recipe.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      # Runs the exact Java-header check followed by the full lifecycle:
      # spotless/checkstyle (validate), compile, unit tests (test), packaging,
      # integration tests (integration-test) and apache-rat (verify) — over the modules
      # the changes job selected. Integration tests
      # use testcontainers-based emulators and require no cloud credentials,
      # so this job is safe to run on any pull request.
      - name: Build and verify
        run: just verify ${{ matrix.lane.args }}

      # The save half of the restore above. `github.ref` is the caller's, so this
      # is `refs/heads/main` for a push and `refs/pull/N/merge` for a pull
      # request reaching here through ci.yaml. Skipped on an exact-key hit
      # because the entry already exists and keys are immutable.
      # One lane saves, not all of them. The key is shared, so without the index every
      # lane would race to reserve it on a push to main: four lose with "already
      # exists", and which lane's downloads end up in the entry is arbitrary. Lane 0
      # restores the accumulated union through the prefix first, so what it writes back
      # is that union plus its own additions rather than a slice.
      #
      # Not a key per lane, which is the other way to remove the race: each lane restores
      # the union and would save a near-full copy of it, so five entries of ~428 MiB per
      # pom hash — against a quota already at 9.6 GiB of 10 GB, which would evict the
      # docs and toolchain caches to buy nothing.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.ref == 'refs/heads/main'
          && strategy.job-index == 0
          && steps.maven_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/io/github/flink-gcp
          key: maven-verify-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}

      # Holds each shaded module's generated META-INF/NOTICE and pinned licence
      # texts to what Maven resolves for its bundle. A step of its own rather than part of
      # `just verify` because the comparison is a Python script, not a Maven
      # plugin; the resolving half *is* bound into the build, and costs almost
      # nothing (it reads POMs Maven already resolved). The recipe re-runs that
      # Maven half, which `just verify` above has already done — kept because a
      # self-contained recipe is the right default locally, and the duplicated
      # work here is a few seconds of an incremental build. Skipped when the
      # built subset contains no shaded module — check_notice tracks whether
      # the selection carries a NOTICE.template. python3 comes from
      # the runner image: the script is standard-library only, so there is no
      # version to pin (see mise.toml).
      # The NOTICE checker reads scripts/config/licence-sources.toml with tomllib,
      # stdlib since Python 3.11 — installed deliberately rather than trusted
      # from the runner image, for the same reason shellcheck is pinned: an
      # image migration must not change what CI runs. Keep the version in
      # step with mise.toml’s python; both mean ">= 3.11 for tomllib". No
      # cache option on purpose: the script has zero pip dependencies, so
      # there is nothing to cache, and `cache: pip` without a requirements
      # file fails the step.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: >-
          matrix.lane.notice != '' ||
          (needs.changes.outputs.check_notice_sources == 'true'
           && strategy.job-index == 0)
        with:
          python-version: '3.12'

      # The shaded modules the `changes` job selected, in reactor order, derived by
      # the same script that decides everything else about the selection: a module
      # carrying a NOTICE.template is a shaded module. Derived rather than listed,
      # so a third `flink-sql-connector-gcp-*` is checked from the commit that adds
      # it — an enumerated list would leave a new module's licensing unchecked with
      # nothing to say so. Deriving it *there* rather than here is what keeps the
      # set checked equal to the set built: a workflow-side rule cannot see the
      # selection, and would pay a second `-am` reactor for a module nothing
      # touched.
      # Through the environment, not interpolated into the script: the value is a
      # workflow output, and `run:` interpolation is a script-injection shape.
      - name: Check the SQL connector NOTICEs
        if: matrix.lane.notice != ''
        env:
          NOTICE_MODULES: ${{ matrix.lane.notice }}
        run: |
          for module in $NOTICE_MODULES; do
            just check-notice "$module"
          done

      # The network-fetching sibling of the offline check above (issue #343):
      # when the change can move a pinned licence source — a pom (the resolved
      # versions feed the {version} url templates), the pin file or its
      # interpreter, a NOTICE — re-fetch every pinned source and require no
      # drift, so a commit editing a licence text and its pin together is
      # caught before merge rather than by the weekly notice_sources job. Every
      # other pull request stays off the network; the weekly job owns the fetch
      # that needs no change to trigger (a deleted tag, an edited archived
      # head).
      # One lane only. The condition is a run-level output, so without the index both
      # lanes would compile the reactor and fetch all fourteen pinned sources -- doubling
      # the exposure to a transient upstream failure the comment above is at pains to
      # keep off ordinary pull requests.
      - name: Verify the licence pins against their sources
        if: >-
          needs.changes.outputs.check_notice_sources == 'true'
          && strategy.job-index == 0
        run: just check-notice-sources

  # This workflow's own verdict, which is what makes its result trustworthy
  # to ci.yaml's gate: a failed job already fails the workflow, but a `build`
  # skipped although change detection asked for it would not — a workflow
  # result cannot see an illegitimate skip — so this job reddens it. The
  # verdict is derived from the whole `needs` context (scripts/ci-gate.py):
  # a job enrolls by joining the `needs` list and nothing else, and the only
  # knowledge passed beside it is which skip is legitimate on this run,
  # computed here because this is where run_build lives. The wiring tests in
  # scripts/tests/test_ci_gate.py hold the `needs` list to the job list.
  verify_passed:
    name: Verify passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build, api_tiers, option_docs, metric_docs, javadoc_links, gated_tags, skill_frontmatter]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED_OK: ${{ needs.changes.outputs.run_build == 'false' && 'build' || '' }}
        run: scripts/ci-gate.py

  # The Flink API tier audit (issue #103): fails when the main sources add a
  # dependency on an @Internal, @Experimental or unannotated Flink type
  # without a reasoned allowlist entry in scripts/config/flink-api-tiers.toml (see
  # .agents/skills/curate-flink-api-tier/ for how to respond).
  #
  # A job here rather than a step in lint.yaml (decided with the user on the
  # pull request that added it): the audit's inputs — the Java main sources
  # and pom.xml's flink.version — are exactly this workflow's trigger set,
  # while lint.yaml's paths filter would have had to grow to every Java
  # source, losing its scripts-and-workflows character. A job of its own
  # rather than a step in `build` so it reports in seconds beside the
  # integration tests instead of behind them, and needs no JDK. Deliberately
  # not behind the changes job: the gate requires its success, it costs
  # seconds, and a job that sometimes skips would reopen the never-reports
  # trap the gate exists to close.
  api_tiers:
    name: Audit Flink API tiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supply the 3.12 interpreter that uv reuses for the locked root project;
      # the project restores Tree-sitter and its Java grammar below.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      # The audit fetches the sources jars of exactly flink.version, so that —
      # not the whole pom.xml — keys the cache below: hashing the pom would
      # save a duplicate immutable entry on every unrelated dependency bump
      # that reaches main, against a quota already near its ceiling (see the
      # Maven cache note above). Read through the script so its parsing has
      # one owner and this step cannot drift from it.
      - name: Read flink.version
        id: flink_version
        run: |
          version="$(mise x uv -- uv run --locked scripts/check-flink-api-tiers.py --print-flink-version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Maven Central rate-limits the shared egress IPs of GitHub-hosted
      # runners, and a 429 here fails the lane on changes that touched nothing
      # tier-related (issue #769): a hit makes this job issue zero Maven
      # Central requests. Restore always, save only on main, for the Maven
      # cache's reason above. No bare restore-keys fallback across
      # flink.version: another version's jars have different filenames, so
      # restoring them buys nothing.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tier_jars
        with:
          path: target/flink-api-tiers
          key: api-tier-jars-${{ steps.flink_version.outputs.version }}-${{ hashFiles('scripts/config/flink-api-tiers.toml') }}
          restore-keys: api-tier-jars-${{ steps.flink_version.outputs.version }}-

      - name: Audit the Flink API tiers the main sources depend on
        run: just check-flink-api-tiers

      # Saved only after a successful audit, so a body that failed to open as
      # a zip (a truncated download, an outage page) cannot enter the cache:
      # build_index() evicts it and fails the job, and this step's implicit
      # success() then skips the save. Exact-key hits skip for the Maven
      # save's reason above; a restore through the prefix reports cache-hit
      # false, so a tier-list edit reaching main is promoted to its new exact
      # key here.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.ref == 'refs/heads/main'
          && steps.tier_jars.outputs.cache-hit != 'true'
        with:
          path: target/flink-api-tiers
          key: api-tier-jars-${{ steps.flink_version.outputs.version }}-${{ hashFiles('scripts/config/flink-api-tiers.toml') }}

  # Is every skill's frontmatter strict YAML (ADR-0069)? A skill that any reader
  # disagrees about fails silently: the file stays valid markdown, no build step
  # reads it, markdownlint's globs exclude SKILL.md, and a skill that did not
  # load looks like Claude choosing not to use it.
  #
  # A job here rather than part of `just lint` for api_tiers' reason exactly:
  # the recipe downloads (PyYAML, through the script's PEP 723 header), and
  # `just lint` stays offline. Not behind the changes job, for the same reason
  # as the two above.
  skill_frontmatter:
    name: Check the skill frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv resolves its own interpreter, so no setup-python here. This script's
      # inline dependency is separate from the root uv project the Java-aware
      # checkers above use.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Check every skill's frontmatter parses
        run: just check-skill-frontmatter

  # The configuration reference check (issue #89): fails when a builder option
  # or a Table API ConfigOption is added, renamed or removed without the page
  # documenting it following along, in either direction (see
  # .agents/skills/curate-option-docs/ for how to respond to each failure).
  #
  # A job here for the same reason as api_tiers above, plus one of its own: its
  # inputs are the Java main sources *and* docs/content/, and pull requests
  # reach this workflow through ci.yaml with no filter at all, while
  # lint.yaml's push-side paths carry docs/content only for markdownlint and
  # would have had to grow to every Java source. Not behind the changes job,
  # like api_tiers and for the same reasons.
  option_docs:
    name: Check the configuration reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supply the 3.12 interpreter that uv reuses for the locked root project;
      # the Java parser dependencies come from uv.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Check every option is documented, and every documented option exists
        run: just check-option-docs

  # The metrics-table check (issue #296): fails when a metric is registered,
  # renamed or removed without the DataStream page's `Metric`-headed tables
  # following along, in either direction, or documented as the wrong kind (see
  # .agents/skills/curate-metric-docs/ for how to respond to each failure). It
  # also holds the mechanical half of the #280 naming rule — no `num`-prefixed
  # name — and the inventory property that every registration goes through a
  # *MetricNames constant.
  #
  # A job here for exactly option_docs's reasons: its inputs are the Java main
  # sources *and* docs/content/ — lint.yaml's push-side paths carry
  # docs/content only for markdownlint and would have had to grow to every
  # Java source, while pull requests reach this workflow through ci.yaml with
  # no filter at all. Not behind the changes job: the gate requires its
  # success, it costs seconds, and a job that sometimes skips would reopen
  # the never-reports trap the gate exists to close.
  metric_docs:
    name: Check the metrics tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supply the 3.12 interpreter that uv reuses for the locked root project;
      # the Java parser dependencies come from uv.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Check every metric is documented, and every documented metric exists
        run: just check-metric-docs

  # The Javadoc reference check (issue #897): fails when a `{@link}`,
  # `{@linkplain}` or `@see` reference written without a parameter list binds a
  # field that shadows the method it names, or names an overloaded method. The
  # first renders no anchor and the second renders an unpredictable one, and the
  # javadoc build reports neither — failOnWarnings does not cover this shape,
  # which is why three pull requests (#840, #890, #891) repaired a site of it by
  # hand before anything checked for it.
  #
  # Its inputs are the Java main sources, so a job here for option_docs's
  # reasons, and not behind the changes job for metric_docs's.
  javadoc_links:
    name: Check the Javadoc references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Supply the 3.12 interpreter that uv reuses for the locked root project;
      # the Java parser dependencies come from uv.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Check every Javadoc reference resolves to the member it names
        run: just check-javadoc-links

  # The gated-suite pairing check (issue #245): a real-GCP ITCase carries both
  # the @EnabledIfEnvironmentVariable the E2E suite is discovered by and the
  # @Tag("gated") that keeps it out of every ordinary build, and this fails
  # when a class has one without the other.
  #
  # Checked rather than merely documented because forgetting the tag fails in
  # the expensive direction — the suite then runs during `just verify` in any
  # shell holding the variable, creating billed Bigtable instances — and
  # because nothing else would notice: CI never sets those variables, so the
  # damage lands on a laptop.
  #
  # A job here rather than in lint.yaml for the reason api_tiers gives: its
  # inputs are the Java test sources, exactly this workflow's trigger set,
  # while lint.yaml's paths filter would have had to grow to every one of them.
  # Not behind the changes job, like api_tiers and for the same reasons. Needs
  # no JDK or network after uv has restored the locked Java parser.
  gated_tags:
    name: Check the gated-suite tagging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: just

      - name: Check every gated ITCase carries both markers
        run: just check-gated-tags
