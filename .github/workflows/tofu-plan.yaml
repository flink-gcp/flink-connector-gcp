name: OpenTofu plan

# Plans the opentofu/ configuration on pull requests and posts the result as a
# PR comment (tfaction v2 drives tofu, tfcmt renders the comment, and the plan
# file travels to the apply workflow as a GitHub Artifact). The list job
# resolves which root modules the PR touched (tofu-list.yaml); the plan job
# fans out over them.
#
# This workflow and tofu-apply.yaml deliberately do not go through a just
# recipe (#111's convention): tfaction is itself the named, rerunnable
# definition of the sequence, and its steps are not meaningful outside a
# workflow run. Local equivalents are `just tofu plan` / `just tofu apply`.
#
# Security model (see opentofu/flink-gcp/wif.tf for the GCP side):
# - No keys anywhere. The plan job mints a short-lived token via WIF for a
#   service account that is read-only on the project plus read-write on the
#   state bucket (state locking writes a lock object).
# - Fork pull requests never get this far: GitHub does not grant
#   `id-token: write` to runs triggered from forks, and the WIF provider
#   condition pins this repository's immutable ID.
on:
  pull_request:
    paths:
      - 'opentofu/**'
      - 'tfaction-root.yaml'
      # Changing any of these workflows must re-verify the pipeline they
      # define.
      - '.github/workflows/tofu-plan.yaml'
      - '.github/workflows/tofu-apply.yaml'
      - '.github/workflows/tofu-list.yaml'
      # mise.toml pins the tofu these jobs run.
      - 'mise.toml'

# NOTE: like docs.yaml and lint.yaml, the paths filter means most pull
# requests never report this workflow — fine while it is optional, but making
# it required means dropping the filter or adding an always-reporting job.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  list:
    uses: ./.github/workflows/tofu-list.yaml
    permissions:
      contents: read
      pull-requests: read

  plan:
    name: tofu plan (${{ matrix.target.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [list]
    # A trigger path can change without touching any root module
    # (mise.toml, a workflow); then there is nothing to plan.
    if: join(fromJSON(needs.list.outputs.targets), '') != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    permissions:
      contents: read
      # tfcmt posts the plan as a PR comment and labels the PR.
      pull-requests: write
      # Mint the GitHub OIDC token that WIF exchanges for GCP credentials.
      id-token: write
    env:
      TFACTION_TARGET: ${{ matrix.target.target }}
      TFACTION_WORKING_DIR: ${{ matrix.target.working_directory }}
      TFACTION_JOB_TYPE: ${{ matrix.target.job_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tofu itself comes from the mise.toml pin, matching what runs locally;
      # tfaction bootstraps its internal tools (tfcmt, ...) itself.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: opentofu

      - name: Set up tfaction
        id: setup
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: setup
          github_token: ${{ github.token }}

      # tfaction v2 no longer runs this itself; the service account and
      # provider come from tfaction-root.yaml via the setup outputs, so the
      # plan job authenticates as the read-only account.
      - name: Authenticate to Google Cloud
        if: steps.setup.outputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: tofu init
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: terraform-init
          github_token: ${{ github.token }}

      - name: tofu plan
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: plan
          github_token: ${{ github.token }}
