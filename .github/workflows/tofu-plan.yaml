name: OpenTofu plan

# Plans the opentofu/ configuration on pull requests and posts the result as a
# PR comment (tfaction v2 drives tofu, tfcmt renders the comment, and the plan
# file travels to the apply workflow as a GitHub Artifact). The list job
# resolves which root modules the PR touched (tofu-list.yaml); the plan job
# fans out over them.
#
# This workflow and tofu-apply.yaml deliberately do not go through a just
# recipe (#111's convention): tfaction is itself the named, rerunnable
# definition of the sequence, and its steps are not meaningful outside a
# workflow run. Local equivalents are `just tofu plan` / `just tofu apply`.
#
# Security model (see opentofu/flink-gcp/wif.tf for the GCP side):
# - No keys anywhere. The plan job mints a short-lived token via WIF for a
#   service account that is read-only on the project plus read-write on the
#   state bucket (state locking writes a lock object).
# - Fork pull requests cannot plan: GitHub does not grant `id-token: write`
#   to runs triggered from forks, and the WIF provider condition pins this
#   repository's immutable ID. Their token is read-only, so on a fork pull
#   request that touches tofu paths the comment and auth steps fail loudly
#   rather than plan. The repository is now public, so that is live debt rather
#   than a hypothetical (issue #6) — and it is also the second, independent
#   reason the App token below is out of a fork's reach: the job never gets
#   past the auth step to mint one.
# - The GitHub App private key (ADR-0121) is the one credential here that is
#   not minted per run. It is a GitHub-side repository secret, which GitHub
#   withholds from fork pull requests, and it buys nothing in GCP. Still no
#   service account keys.
on:
  # No pull_request trigger and no paths filter: pull requests reach this
  # workflow through ci.yaml, whose required `CI passed` gate needs it, and
  # tfaction's list-targets is the change detection — at job level, so a
  # pull request touching nothing under tfaction's markers runs only
  # hide-comment and list (seconds, no GCP auth) and the plan job skips on
  # the empty matrix. tofu-apply.yaml keeps its own paths, and what they have
  # to stay in step with is tfaction's markers rather than this file: a path
  # the markers cover but that list omits skips the apply for a merge that
  # *did* have a reviewed plan. The reverse direction is free — a listed path
  # no marker covers starts the workflow, list-targets returns an empty matrix
  # and the apply job skips, as it did on the merge of #385.
  #
  # Having no runs of its own is also why tfaction-root.yaml's
  # plan_workflow_name names ci.yaml rather than this file: the plan artifact
  # belongs to the caller's run, and naming this one made every apply fail with
  # "No workflow run is found" (issue #444).
  workflow_call:
    secrets:
      # Optional: fork pull requests do not receive it, and the test step
      # below skips rather than fails when it is absent. ci.yaml passes it
      # explicitly, because a called workflow inherits `vars` but not secrets.
      BOT_APP_PRIVATE_KEY:
        required: false

# No concurrency group here: inside a workflow_call, github.workflow is the
# caller's name, so a group defined here would collide with every sibling
# ci.yaml calls. ci.yaml owns concurrency for pull requests.

permissions: {}

jobs:
  # Each new plan hides the outdated plan comments, so the visible comment is
  # always the one that would apply.
  hide-comment:
    name: Hide outdated comments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: hide-comment
          github_token: ${{ github.token }}

  list:
    uses: ./.github/workflows/tofu-list.yaml
    permissions:
      contents: read
      pull-requests: read

  plan:
    name: tofu plan (${{ matrix.target.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [list]
    # A trigger path can change without touching any root module
    # (mise.toml, a workflow); then there is nothing to plan.
    if: join(fromJSON(needs.list.outputs.targets), '') != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    permissions:
      contents: read
      # tfcmt posts the plan as a PR comment and labels the PR.
      pull-requests: write
      # Mint the GitHub OIDC token that WIF exchanges for GCP credentials.
      id-token: write
    env:
      TFACTION_TARGET: ${{ matrix.target.target }}
      TFACTION_WORKING_DIR: ${{ matrix.target.working_directory }}
      TFACTION_JOB_TYPE: ${{ matrix.target.job_type }}
      # The `secrets` context is unavailable in a step's `if:`, so the
      # precondition becomes a job-level flag. A flag rather than the key
      # itself: this puts "are both credentials present" into every step's
      # environment without putting the key there.
      APP_CREDENTIALS: ${{ (vars.BOT_APP_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '') && 'yes' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tofu and tflint come from the mise.toml pins, matching what runs
      # locally; tfaction bootstraps its internal tools (tfcmt, reviewdog, ...)
      # itself, but not tflint — it runs that as a plain PATH command, so no
      # aqua configuration is needed here.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: opentofu tflint

      - name: Set up tfaction
        id: setup
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: setup
          github_token: ${{ github.token }}

      # tfaction v2 no longer runs this itself; the service account and
      # provider come from tfaction-root.yaml via the setup outputs, so the
      # plan job authenticates as the read-only account.
      - name: Authenticate to Google Cloud
        if: steps.setup.outputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: tofu init
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: terraform-init
          github_token: ${{ github.token }}

      # ADR-0121: the App, not github.token, because a github.token push starts
      # no new run and would leave the fixed branch behind stale checks. Gated
      # on both credentials being present rather than on the event, so a fork
      # pull request or a half-finished rotation skips the step below instead
      # of failing the job.
      - name: Mint an App token for the fix commits
        id: app-token
        if: env.APP_CREDENTIALS != ''
        # A key that is present but no longer valid — rotated on the App, or the
        # App uninstalled — fails this step, and a failed step would skip `tofu
        # plan` below and leave the pull request with no plan comment at all.
        # Degrade to the no-App behaviour instead: the test step reads `outcome`,
        # so it skips, and the plan still runs.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # check-providers, `tofu validate`, tflint and `tofu fmt`. It has to come
      # after init, and not only because validate needs an initialized
      # directory: check-providers reads the provider set out of
      # `tofu version -json`, which is empty before init, so there it would pass
      # without checking anything. A fixable finding is pushed to the branch and
      # this step then fails the run; the App's push starts the next one. Two
      # rounds when tflint and fmt both have work, since tflint throws before
      # fmt runs. trivy is off — tfaction-root.yaml carries the measurement.
      # Skipped without the App token; `just lint` covers fmt and tflint there.
      - name: tofu test
        if: steps.app-token.outcome == 'success'
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: test
          github_token: ${{ steps.app-token.outputs.token }}

      - name: tofu plan
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: plan
          github_token: ${{ github.token }}

  # This workflow's own verdict, which is what makes its result trustworthy
  # to ci.yaml's gate: a failed job already fails the workflow, but a plan
  # skipped although list-targets found targets would not — a workflow result
  # cannot see an illegitimate skip — so this job reddens it. The verdict is
  # derived from the whole `needs` context (scripts/ci-gate.py); the one
  # legitimate skip, plan on an empty target list, is computed here because
  # this is where the list output lives.
  tofu_plan_passed:
    name: Tofu plan passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [hide-comment, list, plan]
    if: ${{ !cancelled() }}
    # The workflow default is {}, which cannot even check out the gate script.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED_OK: ${{ join(fromJSON(needs.list.outputs.targets), '') == '' && 'plan' || '' }}
        run: scripts/ci-gate.py
