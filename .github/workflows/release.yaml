name: Release

# A tag stages both version lines, publishes only after both are VALIDATED,
# and creates the GitHub Release after both are PUBLISHED (#1185, ADR-0147).
# The three are separate jobs, so a run that fails after staging is finished
# with "Re-run failed jobs": the failed publication or Release job runs again
# with the staged deployment IDs, and staging never repeats (#1980).
# workflow_dispatch is the dry run for both lines: mode rehearse (the default,
# #1818) builds and inspects both bundles without uploading them, and mode
# validate uploads both, waits for validation and drops them. The publication
# jobs' event guard prevents publication even when the dispatch targets a tag.
on:
  push:
    tags:
      # Exactly vX.Y.Z: anything looser (v*, or even v[0-9]*) also matches
      # tags like v1-experiment and leaves a red "Release" run for something
      # that was never a release. An LTS-only tag (v1.0.0-1.20) is
      # deliberately NOT a trigger — a release is both version lines from one
      # bare tag. A dispatch rehearses the same pair from a bare version.
      # The one shape the glob cannot exclude is a leading zero (v01.2.3):
      # that IS an attempted release with a malformed version, the guard
      # fails it before anything is signed, and the red run is the right
      # outcome — the tag needs deleting either way.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Bare version for the dry run (X.Y.Z; no v prefix or -1.20 suffix).
        required: true
        type: string
      mode:
        description: >-
          rehearse builds and inspects both lines' Central bundles and
          uploads nothing. validate uploads both lines, waits for
          validation and drops them; a dropped deployment may count toward
          the namespace's monthly Central usage.
        required: true
        type: choice
        options:
          - rehearse
          - validate
        default: rehearse

# One release at a time, globally: interleaved Portal uploads would be
# impossible to tell apart on the deployments page. Note GitHub keeps at most
# ONE pending run per group whatever cancel-in-progress says: with tags v1 and
# v2 queued behind a running release, v2's arrival cancels the still-pending
# v1 with a grey "cancelled", not a red failure. Re-run a cancelled release
# from the Actions UI — the tag is still there.
concurrency:
  group: release
  cancel-in-progress: false

# The default token is dropped entirely at the workflow level; each job
# re-grants only what it needs. No job holds both the Central token and a
# write scope: staging reads, and only the Release job, which holds no
# release secret, writes.
permissions: {}

jobs:
  stage:
    # Tag pushes on a fork must not reach for this repository's secrets; the
    # immutable repository ID, not the owner name, for the reason e2e.yaml
    # records (a transfer or rename switches a name guard off silently).
    if: github.repository_id == '1305440656'
    # The re-run guard below matches this name in the previous attempt.
    name: Stage and validate both lines
    # The release secrets live only in this environment, whose ref policy
    # (main and v* tags) GitHub enforces even where a branch's copy of this
    # file drops the ancestry check below; a dispatch in either mode therefore
    # targets main or a release tag (ADR-0147, #1971).
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The re-run guard reads the previous attempt's jobs.
      actions: read
    # Each validation waits up to the plugin's 30-minute waitMaxTime default;
    # setup and both builds took 15 minutes for v1.3.0 (run 41269916162). IDs
    # are saved after upload, before the plugin waits for validation.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      deployment-2x: ${{ steps.ids.outputs.deployment-2x }}
      deployment-1x: ${{ steps.ids.outputs.deployment-1x }}
    steps:
      # "Re-run all jobs" after this job succeeded in any earlier attempt would
      # stage the version again while its deployments are PUBLISHING or
      # PUBLISHED, so refuse before anything is signed. Every earlier attempt
      # counts: a refused attempt fails this job, and a later "Re-run failed
      # jobs" would otherwise find only that failure. A refused run has lost its
      # outputs, so the recovery is then by hand (ADR-0147). After staging
      # failed in every earlier attempt, a re-run stages afresh, as before.
      - name: Refuse to restage a staged release
        if: github.event_name == 'push' && github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_JOB: Stage and validate both lines
        run: |
          for ((attempt = 1; attempt < GITHUB_RUN_ATTEMPT; attempt++)); do
            conclusion=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs" \
              --jq ".jobs[] | select(.name == env.STAGE_JOB) | .conclusion")
            if [ "$conclusion" = success ]; then
              echo "attempt $attempt already staged this release; do not stage it again." \
                "Finish it by hand with that attempt's deployment IDs (ADR-0147, Recovery)." >&2
              exit 1
            fi
          done

      # persist-credentials matters more here than anywhere else in this
      # repository: this job holds the signing key and the Central token while
      # it executes third-party Maven plugin code, which must not also find a
      # token in .git/config. fetch-depth 0 is for the ancestry assertion below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # No Maven cache, deliberately: verify.yaml documents why setup-java's
      # cache was removed there (no restore-keys, ref-scoped eviction), and a
      # release build additionally installs release-versioned
      # io.github.flink-gcp artifacts that must never seed a cache other jobs
      # restore. A release downloads its dependencies fresh.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # uv runs scripts/stage-release-guard.py inside the recipe. Shims stay
      # off the PATH so mise's java can never shadow the setup-java JDK the
      # published bytecode is compiled with (ADR-0057).
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: uv
          add_shims_to_path: false

      # Unpinned, and install-action rather than mise: see the note on the
      # same step in verify.yaml.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # The version this run stages. A tag arrives as v1.0.0 and the v is
      # stripped here; the recipe's guard re-validates the result either way,
      # so a malformed tag or input fails before versions:set runs.
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release: expected bare X.Y.Z, without v prefix or -1.20 suffix" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ADR-0147 justifies -DskipTests with "the staged commit already passed
      # every CI lane", and a tag push runs no verification of its own — so
      # the claim is enforced instead: the tagged commit must already be on
      # main. A tag cut one commit early, or on a branch, dies here before
      # anything is signed or uploaded.
      - name: Assert the tag is on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "the tagged commit is not an ancestor of main; releases are cut from merged history" >&2
            exit 1
          }

      # weekly.yaml's FLINK_LTS is the single place the LTS patch is pinned
      # (the version-policy edit list moves it); read it rather than repeat
      # it. The sed is coupled to that line's exact shape — a reformat fails
      # loudly here, before anything is uploaded.
      - name: Resolve the LTS patch from the weekly matrix
        id: lts
        if: inputs.mode != 'rehearse'
        run: |
          flink_lts=$(sed -n "s/^  FLINK_LTS: '\(.*\)'\$/\1/p" .github/workflows/weekly.yaml | head -1)
          test -n "$flink_lts" || { echo "FLINK_LTS not found in weekly.yaml" >&2; exit 1; }
          echo "flink_lts=$flink_lts" >> "$GITHUB_OUTPUT"

      # The same script a maintainer staging by hand runs; the file it writes
      # references ${env.*}, so the token pair never touches disk. --overwrite
      # because setup-java has already written a throwaway settings.xml on
      # this runner; by hand, the script refuses an existing file instead.
      - name: Point Maven at the Central Portal credentials
        if: inputs.mode != 'rehearse'
        run: scripts/write-central-settings.sh --overwrite

      # The capture wrapper preserves Maven's failure and records an upload ID
      # before validation, including on a failed run. Files stay outside the
      # tree so the next clean build and RAT cannot consume them.
      - name: Stage the Flink 2.x line
        if: inputs.mode != 'rehearse'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          name="flink-connector-gcp $VERSION (run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="$name dry run"
          fi
          just central-portal capture "$RUNNER_TEMP/central-2x.id" \
            just stage-release "$VERSION" -DdeploymentName="$name"

      # Collected OUTSIDE the working tree: the next staging build opens with
      # `clean` (which would wipe target/) and runs apache-rat over the whole
      # tree (which fails on a collected .asc). The script asserts the count,
      # so a build that lost or renamed an uber-jar stops before Publish; the
      # GitHub Release itself is built from Central's copies.
      - name: Collect the staged uber-jars
        if: inputs.mode != 'rehearse'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/collect-release-jars.sh "$VERSION" "$RUNNER_TEMP/dist"

      - name: Stage the Flink 1.20 LTS line
        if: inputs.mode != 'rehearse'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLINK_LTS: ${{ steps.lts.outputs.flink_lts }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          name="flink-connector-gcp $VERSION-1.20 (run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="$name dry run"
          fi
          just central-portal capture "$RUNNER_TEMP/central-1x.id" \
            just stage-release "$VERSION-1.20" -Dflink.version="$FLINK_LTS" -DdeploymentName="$name"

      - name: Collect the 1.20 uber-jars
        if: inputs.mode != 'rehearse'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/collect-release-jars.sh "$VERSION-1.20" "$RUNNER_TEMP/dist"

      # The rehearsal reads no Central credentials, so this step holds no
      # Central token. The size table and any defect land in the run summary.
      - name: Rehearse both lines without uploading
        if: inputs.mode == 'rehearse'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: just rehearse-release "$VERSION"

      # Runs only once every earlier step succeeded, so both lines staged,
      # validated and collected; the publication jobs then start only on this
      # job's success (a bare if over needs keeps the implicit success()).
      - name: Hand both deployment IDs to the publication
        id: ids
        if: github.event_name == 'push'
        run: |
          outputs=()
          for line in 2x 1x; do
            # Two IDs leave a newline inside, which the anchored pattern rejects.
            id=$(cat "$RUNNER_TEMP/central-$line.id")
            if [[ ! "$id" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
              echo "release: expected one captured deployment ID for the $line line" >&2
              exit 1
            fi
            outputs+=("deployment-$line=$id")
          done
          printf '%s\n' "${outputs[@]}" >> "$GITHUB_OUTPUT"

      # Also clean up a successful first upload if the second staging run fails.
      # Missing files mean no ID was captured. A validation still in progress or
      # a failed Drop leaves a red run and its ID in the summary for recovery.
      - name: Drop dry-run deployments
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode != 'rehearse'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          ids=()
          for file in "$RUNNER_TEMP/central-2x.id" "$RUNNER_TEMP/central-1x.id"; do
            if [ -f "$file" ]; then
              while IFS= read -r id; do ids+=("$id"); done < "$file"
            fi
          done
          if [ "${#ids[@]}" -gt 0 ]; then
            just central-portal drop "${ids[@]}"
          fi

  # Sends Publish only for a VALIDATED deployment, waits on a PUBLISHING one and
  # returns at once for PUBLISHED ones, so a re-run resumes where the last
  # attempt stopped. It holds the Central token but no signing key, runs no
  # build, and has no write scope.
  publish-central:
    if: github.event_name == 'push'
    needs: stage
    name: Publish both Central deployments
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # central-portal.py's 3-hour WAIT_TIMEOUT, with minutes for setup.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Publish or wait for both Central deployments
        env:
          DEPLOYMENT_2X: ${{ needs.stage.outputs.deployment-2x }}
          DEPLOYMENT_1X: ${{ needs.stage.outputs.deployment-1x }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: just central-portal publish "$DEPLOYMENT_2X" "$DEPLOYMENT_1X"

  # Built from Maven Central's files on every attempt, so the attachments are
  # the published artifacts, checked against their .sha1 and the release key,
  # and a re-run follows the same path as the first attempt. Generated notes
  # remain the release history mechanism (#29). It holds no release secret.
  github-release:
    if: github.event_name == 'push'
    needs: [stage, publish-central]
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Up to 30 minutes for repo1 to serve every file, then the transfers.
    timeout-minutes: 60
    steps:
      # The tag's checkout fixes the set of SQL uber-jar modules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download and verify the published uber-jars
        env:
          VERSION: ${{ needs.stage.outputs.version }}
        run: python3 scripts/release-assets.py download "$VERSION" "$RUNNER_TEMP/dist"

      # A draft created with --verify-tag, published only once its attachments
      # are exactly the downloaded files.
      - name: Create or complete the GitHub Release
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-assets.py complete "$VERSION" "$RUNNER_TEMP/dist"
