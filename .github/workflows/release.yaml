name: Release

# Stages a release on the Central Portal without publishing it (issue #724,
# ADR-0147). A tag push runs `just stage-release` once per version line — bare
# X.Y.Z for the Flink 2.x range and X.Y.Z-1.20 for the 1.x LTS — and each
# upload stops at VALIDATED: the one-way Publish is a deliberate click in the
# Portal UI, once per line. The GitHub Release is created as a DRAFT with the
# collected SQL uber-jars and their signatures attached, and is published by
# hand together with the Portal clicks so the public artifacts appear at the
# same moment (issue #29 records why there is no CHANGELOG.md; for v1.0.0 the
# generated notes are replaced by a short curated summary before publishing).
#
# workflow_dispatch is the validate-then-drop dry run: it stages exactly the
# version it is given — one line per dispatch, so rehearsing both lines is two
# dispatches — names the Portal deployment "dry run", and drafts no GitHub
# Release (the event guard, not the absence of a tag: a dispatch can be aimed
# at a tag ref).
#
# The recipe's guards (scripts/stage-release-guard.py and the
# enforce-version-line-toolchain enforcer rule) hold the version shape and the
# version/toolchain pairing per staging run. They cannot make the two runs
# atomic: a failure in the LTS half leaves the bare line already VALIDATED on
# the Portal, and recovery — Drop the orphaned deployment, delete a leftover
# draft, then re-run — is written down in ADR-0147's Consequences.
on:
  push:
    tags:
      # Exactly vX.Y.Z: anything looser (v*, or even v[0-9]*) also matches
      # tags like v1-experiment and leaves a red "Release" run for something
      # that was never a release. An LTS-only tag (v1.0.0-1.20) is
      # deliberately NOT a trigger — a release is both version lines from one
      # bare tag, and the LTS line alone is only ever a dispatch rehearsal.
      # The one shape the glob cannot exclude is a leading zero (v01.2.3):
      # that IS an attempted release with a malformed version, the guard
      # fails it before anything is signed, and the red run is the right
      # outcome — the tag needs deleting either way.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stage for the dry run (X.Y.Z or X.Y.Z-1.20; no v prefix).
          Drop the VALIDATED deployment in the Portal afterwards.
        required: true
        type: string

# One release at a time, globally: interleaved Portal uploads would be
# impossible to tell apart on the deployments page. Note GitHub keeps at most
# ONE pending run per group whatever cancel-in-progress says: with tags v1 and
# v2 queued behind a running release, v2's arrival cancels the still-pending
# v1 with a grey "cancelled", not a red failure. Re-run a cancelled release
# from the Actions UI — the tag is still there.
concurrency:
  group: release
  cancel-in-progress: false

# The default token is dropped entirely at the workflow level; the one job
# re-grants the single scope the draft-release step needs.
permissions: {}

jobs:
  stage:
    # Tag pushes on a fork must not reach for this repository's secrets; the
    # immutable repository ID, not the owner name, for the reason e2e.yaml
    # records (a transfer or rename switches a name guard off silently).
    if: github.repository_id == '1305440656'
    name: Stage on the Central Portal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two staging builds plus two Portal validation waits, each of which the
    # upload plugin polls for up to its waitMaxTime default — 1800 s, read
    # from the plugin descriptor — before giving up; a ceiling below that
    # budget would cancel the job while a deployment is mid-validation, with
    # its id never printed. 2 x 30 min of waiting plus two uncached builds
    # fits with room to spare.
    timeout-minutes: 150
    steps:
      # persist-credentials matters more here than anywhere else in this
      # repository: this is the one job that both holds a write-capable token
      # and executes third-party Maven plugin code, and the draft-release
      # action authenticates from its env, not from .git/config. fetch-depth 0
      # is for the ancestry assertion below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # No Maven cache, deliberately: verify.yaml documents why setup-java's
      # cache was removed there (no restore-keys, ref-scoped eviction), and a
      # release build additionally installs release-versioned
      # io.github.flink-gcp artifacts that must never seed a cache other jobs
      # restore. A release downloads its dependencies fresh.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      # uv runs scripts/stage-release-guard.py inside the recipe. Shims stay
      # off the PATH so mise's java can never shadow the setup-java JDK the
      # published bytecode is compiled with (ADR-0057).
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv
          add_shims_to_path: false

      # Unpinned, and install-action rather than mise: see the note on the
      # same step in verify.yaml.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just

      # The version this run stages. A tag arrives as v1.0.0 and the v is
      # stripped here; the recipe's guard re-validates the result either way,
      # so a malformed tag or input fails before versions:set runs.
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      # ADR-0147 justifies -DskipTests with "the staged commit already passed
      # every CI lane", and a tag push runs no verification of its own — so
      # the claim is enforced instead: the tagged commit must already be on
      # main. A tag cut one commit early, or on a branch, dies here before
      # anything is signed or uploaded.
      - name: Assert the tag is on main
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "the tagged commit is not an ancestor of main; releases are cut from merged history" >&2
            exit 1
          }

      # weekly.yaml's FLINK_LTS is the single place the LTS patch is pinned
      # (the version-policy edit list moves it); read it rather than repeat
      # it. The sed is coupled to that line's exact shape — a reformat fails
      # loudly here, before anything is uploaded.
      - name: Resolve the LTS patch from the weekly matrix
        id: lts
        run: |
          flink_lts=$(sed -n "s/^  FLINK_LTS: '\(.*\)'\$/\1/p" .github/workflows/weekly.yaml | head -1)
          test -n "$flink_lts" || { echo "FLINK_LTS not found in weekly.yaml" >&2; exit 1; }
          echo "flink_lts=$flink_lts" >> "$GITHUB_OUTPUT"

      # The same script a maintainer staging by hand runs; the file it writes
      # references ${env.*}, so the token pair never touches disk. --overwrite
      # because setup-java has already written a throwaway settings.xml on
      # this runner; by hand, the script refuses an existing file instead.
      - name: Point Maven at the Central Portal credentials
        run: scripts/write-central-settings.sh --overwrite

      # On a tag this is always the bare 2.x line (the trigger admits no
      # other shape); a dispatch stages exactly the version it was given, so
      # a -1.20 input rehearses the LTS line and needs the LTS toolchain flag
      # here too (the recipe adds flink.compat itself and its guard holds the
      # pairing either way). deploymentName is
      # what keeps the Portal deployments page legible: it names the line and
      # the run, and marks a dry run as one, so a re-run after a partial
      # failure is distinguishable from the deployment it replaces.
      - name: Stage the requested line
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLINK_LTS: ${{ steps.lts.outputs.flink_lts }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          name="flink-connector-gcp $VERSION (run $GITHUB_RUN_ID)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="$name dry run"
          fi
          if [[ "$VERSION" == *-1.20 ]]; then
            just stage-release "$VERSION" -Dflink.version="$FLINK_LTS" -DdeploymentName="$name"
          else
            just stage-release "$VERSION" -DdeploymentName="$name"
          fi

      # Collected OUTSIDE the working tree: the next staging build opens with
      # `clean` (which would wipe target/) and runs apache-rat over the whole
      # tree (which fails on a collected .asc). The script asserts the count,
      # so a draft Release can never quietly miss an artifact.
      - name: Collect the staged uber-jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/collect-release-jars.sh "$VERSION" "$RUNNER_TEMP/dist"

      - name: Stage the Flink 1.20 LTS line
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLINK_LTS: ${{ steps.lts.outputs.flink_lts }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: just stage-release "$VERSION-1.20" -Dflink.version="$FLINK_LTS" -DdeploymentName="flink-connector-gcp $VERSION-1.20 (run $GITHUB_RUN_ID)"

      - name: Collect the 1.20 uber-jars
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/collect-release-jars.sh "$VERSION-1.20" "$RUNNER_TEMP/dist"

      # Draft, deliberately: publishing it is the same manual gate as the
      # Portal's Publish clicks, taken together once every deployment is
      # VALIDATED. The generated notes are the release history mechanism —
      # there is no CHANGELOG.md (issue #29).
      - name: Draft the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: ${{ runner.temp }}/dist/*
