name: Tier-3 run

# A dispatch is an execution approval for this fixed workload and its ceilings.
# Recovery only stops a completed execution's resources; it never admits work.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Normal completion, one savepoint upgrade and one JM Pod deletion, or one Cloud Tasks measurement session'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - generic-recovery
          - cloudtasks
      run_id:
        description: 'Unique lowercase run ID (at most 40 characters)'
        required: true
        type: string
      reviewed_sha:
        description: 'Exact reviewed current main commit (40 hexadecimal characters)'
        required: true
        type: string
      expires_at:
        description: 'UTC expiry ending in Z: 55 to 60 minutes ahead for smoke/generic-recovery; session plan plus 15 minutes, at most 300 minutes, for cloudtasks'
        required: true
        type: string
      approval:
        description: 'Type APPROVE ONE SMOKE RUN: 5 PODS, 60 MINUTES, USD 1, or APPROVE ONE CLOUD TASKS SESSION: 5 PODS, 300 MINUTES, USD 10, 0 DISPATCHES'
        required: true
        type: string
      session:
        description: 'Cloud Tasks only: session file name under kubernetes/lifecycle/sessions, without .toml'
        required: false
        type: string
        default: ''
      flink_version:
        description: 'Cloud Tasks only: runtime line; selects the published application package'
        required: false
        type: choice
        default: '2.2.1'
        options:
          - '2.2.1'
          - '1.20.4'
      application_digest:
        description: 'Cloud Tasks only: published sha256:... digest of the selected application package; verified live, never pinned'
        required: false
        type: string
        default: ''

permissions: {}
concurrency:
  group: tier3-run
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scenario == 'cloudtasks' && 360 || 85 }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: cue kubectl uv opentofu helm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '577.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Run the explicitly approved smoke lifecycle
        id: lifecycle
        continue-on-error: true
        env:
          RUN_ID: ${{ inputs.run_id }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          APPROVAL: ${{ inputs.approval }}
          SCENARIO: ${{ inputs.scenario }}
          SESSION: ${{ inputs.session }}
          FLINK_VERSION: ${{ inputs.flink_version }}
          APPLICATION_DIGEST: ${{ inputs.application_digest }}
        run: |
          start=(start --run-id "$RUN_ID" --sha "$REVIEWED_SHA" --expires-at "$EXPIRES_AT" --approve "$APPROVAL" --scenario "$SCENARIO")
          if [ "$SCENARIO" = cloudtasks ]; then
            start+=(--session "$SESSION" --flink-version "$FLINK_VERSION" --application-digest "$APPLICATION_DIGEST")
          fi
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle \
            --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" "${start[@]}"
      - name: Authenticate for read-only infrastructure verification
        if: ${{ !cancelled() && steps.lifecycle.outputs.idle == 'true' }}
        id: plan-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: opentofu-plan@flink-gcp.iam.gserviceaccount.com
      - name: Prove all three refreshed plans are empty under the retained lock
        if: ${{ !cancelled() && steps.plan-auth.outcome == 'success' }}
        id: plans
        run: >-
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle
          --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" plans
      - name: Authenticate to write the final evidence receipt
        if: ${{ !cancelled() && steps.plans.outcome == 'success' }}
        id: receipt-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - name: Verify idle again, retain result and release the environment lock
        if: ${{ !cancelled() && steps.receipt-auth.outcome == 'success' }}
        run: >-
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle
          --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" finish
      - name: Preserve lifecycle failure
        if: ${{ !cancelled() && steps.lifecycle.outcome == 'failure' }}
        run: exit 1
