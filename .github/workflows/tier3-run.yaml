name: Tier-3 run

# A dispatch is the owner's execution approval, given after approving the
# run's estimate. Recovery only stops a completed execution's resources; it
# never admits work.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Normal completion, or one BigQuery, Pub/Sub or Cloud Tasks recovery trial'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - bigquery-recovery
          - pubsub-recovery
          - cloudtasks-recovery
      run_id:
        description: 'Unique lowercase run ID (at most 40 characters)'
        required: true
        type: string
      application_digest:
        description: 'Recovery trials: published sha256:... digest of the application package; verified live, never pinned'
        required: false
        type: string
        default: ''
      rig_sha:
        description: 'Optional full SHA of the rig to run, when not this main commit; it must head a branch of this repository'
        required: false
        type: string
        default: ''
      trial:
        description: 'BigQuery only: delivery method and destination count, and the fault that replaces one recovery, if any'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'alo-10'
          - 'eo-10'
          - 'alo-50'
          - 'eo-50'
          - 'fl-10'
          - 'eo-10-tm-replacement'
          - 'eo-10-rescale-out'
          - 'eo-10-rescale-in'
          - 'fl-10-tm-replacement'
          - 'fl-10-rescale-out'
          - 'fl-10-rescale-in'
      pubsub_trial:
        description: 'Pub/Sub only: reviewed trial file name under kubernetes/lifecycle/pubsub-trials, without .toml (jm-replacement, tm-replacement, rescale-out or rescale-in)'
        required: false
        type: string
        default: ''
      cloudtasks_trial:
        description: 'Cloud Tasks only: the trial kind, which names the Pod deleted after the savepoint upgrade or the rescale the upgrade makes (jm-replacement, tm-replacement, rescale-out or rescale-in)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'jm-replacement'
          - 'tm-replacement'
          - 'rescale-out'
          - 'rescale-in'

permissions: {}
concurrency:
  group: tier3-run
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The window plus room for dispatch, cleanup and the empty-plan proof.
    timeout-minutes: ${{ (inputs.scenario == 'bigquery-recovery' || inputs.scenario == 'cloudtasks-recovery') && 120 || 85 }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the rig commit heads a branch of this repository
        # Runs from main's workflow before any rig source is checked out, so a
        # fork commit reachable through a pull request ref cannot be selected.
        if: ${{ inputs.rig_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RIG_SHA: ${{ inputs.rig_sha }}
        run: |
          if ! [[ "$RIG_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rig_sha must be a full lowercase commit SHA"
            exit 1
          fi
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RIG_SHA/branches-where-head" --jq length)
          if [ "$heads" -lt 1 ]; then
            echo "::error::rig_sha must be the head of a branch of this repository"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow itself always runs from main; this selects the rig.
          ref: ${{ inputs.rig_sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: cue kubectl uv opentofu helm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '577.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Run the dispatched lifecycle
        id: lifecycle
        continue-on-error: true
        env:
          RUN_ID: ${{ inputs.run_id }}
          SCENARIO: ${{ inputs.scenario }}
          APPLICATION_DIGEST: ${{ inputs.application_digest }}
          TRIAL: ${{ inputs.trial }}
          PUBSUB_TRIAL: ${{ inputs.pubsub_trial }}
          CLOUDTASKS_TRIAL: ${{ inputs.cloudtasks_trial }}
          RIG_SHA: ${{ inputs.rig_sha }}
        run: |
          start=(start --run-id "$RUN_ID" --scenario "$SCENARIO")
          if [ -n "$RIG_SHA" ]; then
            start+=(--rig-sha "$RIG_SHA")
          fi
          if [ "$SCENARIO" = bigquery-recovery ]; then
            start+=(--trial "$TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = pubsub-recovery ]; then
            start+=(--pubsub-trial "$PUBSUB_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = cloudtasks-recovery ]; then
            start+=(--cloudtasks-trial "$CLOUDTASKS_TRIAL" --application-digest "$APPLICATION_DIGEST")
          fi
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle \
            --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" "${start[@]}"
      - name: Authenticate for read-only infrastructure verification
        if: ${{ !cancelled() && steps.lifecycle.outputs.idle == 'true' }}
        id: plan-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: opentofu-plan@flink-gcp.iam.gserviceaccount.com
      - name: Prove all three refreshed plans are empty under the retained lock
        if: ${{ !cancelled() && steps.plan-auth.outcome == 'success' }}
        id: plans
        run: >-
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle
          --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" plans
      - name: Authenticate to write the final evidence receipt
        if: ${{ !cancelled() && steps.plans.outcome == 'success' }}
        id: receipt-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - name: Verify idle again, retain result and release the environment lock
        if: ${{ !cancelled() && steps.receipt-auth.outcome == 'success' }}
        run: >-
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle
          --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" finish
      - name: Preserve lifecycle failure
        if: ${{ !cancelled() && steps.lifecycle.outcome == 'failure' }}
        run: exit 1
