name: Tier-3 run

# A dispatch is the owner's execution approval. Recovery only stops a
# completed execution's resources; it never admits work.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Normal completion, or one BigQuery, Pub/Sub, Cloud Tasks, Bigtable, Spanner or Firestore recovery trial'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - bigquery-recovery
          - pubsub-recovery
          - cloudtasks-recovery
          - bigtable-recovery
          - spanner-recovery
          - firestore-recovery
      run_id:
        description: 'Unique lowercase run ID (at most 40 characters)'
        required: true
        type: string
      application_digest:
        description: 'Recovery trials: published sha256:... digest of the application package; verified live, never pinned'
        required: false
        type: string
        default: ''
      rig_sha:
        description: 'Optional full SHA of the rig to run, when not this main commit; it must head a branch of this repository'
        required: false
        type: string
        default: ''
      bigquery_trial:
        description: 'BigQuery only: the delivery method of the fault sequence, which injects every fault in one run (ADR-0204), at ten destinations, FILE_LOADS with the background staging uploader on'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'alo-10-sequence'
          - 'eo-10-sequence'
          - 'fl-10-uploader-sequence'
      pubsub_trial:
        description: 'Pub/Sub only: the trial kind, sequence, which injects every fault in one run (ADR-0204)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'sequence'
      cloudtasks_trial:
        description: 'Cloud Tasks only: the trial kind, sequence, which injects every fault in one run (ADR-0204)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'sequence'
      bigtable_trial:
        description: 'Bigtable only: the trial kind, sequence, which injects every fault in one run (ADR-0204)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'sequence'
      spanner_trial:
        description: 'Spanner only: the trial kind, sequence, which injects every fault in one run (ADR-0204)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'sequence'
      firestore_trial:
        description: 'Firestore only: the trial kind, sequence, which injects every fault in one run (ADR-0204)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'sequence'

permissions: {}
concurrency:
  group: tier3-run
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The window plus room for dispatch, cleanup and the empty-plan proof.
    timeout-minutes: ${{ (inputs.scenario == 'bigquery-recovery' || inputs.scenario == 'pubsub-recovery' || inputs.scenario == 'cloudtasks-recovery' || inputs.scenario == 'bigtable-recovery' || inputs.scenario == 'spanner-recovery' || inputs.scenario == 'firestore-recovery') && 120 || 85 }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the rig commit heads a branch of this repository
        # Runs from main's workflow before any rig source is checked out, so a
        # fork commit reachable through a pull request ref cannot be selected.
        if: ${{ inputs.rig_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RIG_SHA: ${{ inputs.rig_sha }}
        run: |
          if ! [[ "$RIG_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rig_sha must be a full lowercase commit SHA"
            exit 1
          fi
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RIG_SHA/branches-where-head" --jq length)
          if [ "$heads" -lt 1 ]; then
            echo "::error::rig_sha must be the head of a branch of this repository"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow itself always runs from main; this selects the rig.
          ref: ${{ inputs.rig_sha || github.sha }}
          persist-credentials: false
      # This workflow no longer plans the roots before `finish`; an older rig
      # still needs those plans to finalize, so it would keep its lock.
      - name: Refuse a rig that predates plan-free finalization
        run: |
          if ! grep -q '    def finalize(self):' tools/tier3/src/flink_tier3/runner.py; then
            echo "::error::rig_sha predates #2115; dispatch from a commit that contains it"
            exit 1
          fi
      # The BigQuery trial is passed as --bigquery-trial since #2226; an older
      # rig parses only --trial and would refuse the dispatch's arguments.
      - name: Refuse a BigQuery rig that predates the renamed trial input
        if: inputs.scenario == 'bigquery-recovery'
        run: |
          if ! grep -q -- '"--bigquery-trial"' tools/tier3/src/flink_tier3/lifecycle.py; then
            echo "::error::rig_sha predates #2226's --bigquery-trial; dispatch from a commit that contains it"
            exit 1
          fi
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: cue kubectl uv opentofu helm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '577.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Run the dispatched lifecycle
        id: lifecycle
        continue-on-error: true
        env:
          RUN_ID: ${{ inputs.run_id }}
          SCENARIO: ${{ inputs.scenario }}
          APPLICATION_DIGEST: ${{ inputs.application_digest }}
          BIGQUERY_TRIAL: ${{ inputs.bigquery_trial }}
          PUBSUB_TRIAL: ${{ inputs.pubsub_trial }}
          CLOUDTASKS_TRIAL: ${{ inputs.cloudtasks_trial }}
          BIGTABLE_TRIAL: ${{ inputs.bigtable_trial }}
          SPANNER_TRIAL: ${{ inputs.spanner_trial }}
          FIRESTORE_TRIAL: ${{ inputs.firestore_trial }}
          RIG_SHA: ${{ inputs.rig_sha }}
        run: |
          start=(start --run-id "$RUN_ID" --scenario "$SCENARIO")
          if [ -n "$RIG_SHA" ]; then
            start+=(--rig-sha "$RIG_SHA")
          fi
          if [ "$SCENARIO" = bigquery-recovery ]; then
            start+=(--bigquery-trial "$BIGQUERY_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = pubsub-recovery ]; then
            start+=(--pubsub-trial "$PUBSUB_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = cloudtasks-recovery ]; then
            start+=(--cloudtasks-trial "$CLOUDTASKS_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = bigtable-recovery ]; then
            start+=(--bigtable-trial "$BIGTABLE_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = spanner-recovery ]; then
            start+=(--spanner-trial "$SPANNER_TRIAL" --application-digest "$APPLICATION_DIGEST")
          elif [ "$SCENARIO" = firestore-recovery ]; then
            start+=(--firestore-trial "$FIRESTORE_TRIAL" --application-digest "$APPLICATION_DIGEST")
          fi
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle \
            --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" "${start[@]}"
      # A run proves it restored what it changed; it does not plan the
      # infrastructure roots, so a merge during the run cannot strand its lock.
      - name: Authenticate to write the final evidence receipt
        if: ${{ !cancelled() && steps.lifecycle.outputs.idle == 'true' }}
        id: receipt-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-runner@flink-gcp.iam.gserviceaccount.com
      - name: Verify idle again, retain result and release the environment lock
        if: ${{ !cancelled() && steps.receipt-auth.outcome == 'success' }}
        # It fails for every run that is not usable, after writing the receipt
        # and releasing the lock.
        run: >-
          uv run --locked --package flink-tier3 --no-dev flink-tier3 lifecycle
          --kubeconfig "$RUNNER_TEMP/tier3-kubeconfig" finish
      - name: Preserve lifecycle failure
        if: ${{ !cancelled() && steps.lifecycle.outcome == 'failure' }}
        run: exit 1
