name: Docs

# On pull requests this runs as a reusable workflow called by ci.yaml, with
# no filter at all — a broken site build reddens the required `CI passed`
# gate there. The push-side paths filter below decides two things: whether a
# push to main spends a run, and — since #93 — whether it republishes the
# site. A site or source-backed-example input missing from the filter therefore
# leaves the published site stale rather than merely unverified, which is why
# each input that can change those outputs is listed, including the generated
# API reference's.
on:
  workflow_call:
  push:
    branches:
      - main
      - v1.20
    paths:
      - 'docs/**'
      # A hugo or go version bump must build the site, and mise.toml is where
      # those versions are declared — the same reasoning as lint.yaml. The
      # justfile is here because it holds the build command.
      - 'mise.toml'
      - 'justfile'
      # This helper runs the synthetic fixture site below; docs/** already
      # carries the fixtures and repository shortcode it exercises.
      - 'scripts/test-java-snippet-shortcode.sh'
      - 'scripts/test-sql-snippet-shortcode.sh'
      - '.github/workflows/docs.yaml'
      # The site contains a generated API reference (#88), so the main sources
      # and the Maven build are inputs to it exactly as docs/ is — the same rule
      # that puts mise.toml above. The root pom.xml is listed separately because
      # GitHub reads `**` as "any character, including /", so `**/pom.xml` needs
      # a slash before it and never matches a path without one — and the root
      # pom is where every javadoc setting lives. Generating the reference also
      # forks the reactor's compile phase, which runs checkstyle and spotless at
      # validate: checkstyle reads tools/maven/checkstyle.xml and
      # suppressions.xml from this repository, so tools/** is an input too;
      # spotless is configured entirely in the parent POM, so it adds nothing.
      - '**/src/main/**'
      # Source-backed Java examples live in an internal test-only module rather
      # than below docs/, so their push must run both compilation and rendering.
      - 'flink-connector-gcp-docs-validation/src/test/**'
      # Spanner GoogleSQL examples are executed against the emulator from
      # their source regions before Hugo renders them. These resources, the
      # named test, and its emulator base define that documentation boundary.
      # Other Spanner test sources are reactor compilation collateral rather
      # than inputs that change the site or its source-backed examples.
      - 'flink-connector-gcp-spanner/src/test/resources/sql-snippets/**'
      - 'flink-connector-gcp-spanner/src/test/java/io/github/flink/gcp/connector/spanner/SpannerDocumentationSqlITCase.java'
      - 'flink-connector-gcp-spanner/src/test/java/io/github/flink/gcp/connector/spanner/AbstractSpannerEmulatorITCase.java'
      # Module READMEs retain ordinary fences for GitHub, and the checker keeps
      # those copies synchronized with compiled sources.
      - 'flink-*/README.md'
      - 'scripts/check-readme-examples.py'
      # Public Javadoc blocks map to compiled sources through this checker.
      - 'scripts/check-javadoc-examples.py'
      # Both source-copy checkers share the Java tagged-region parser.
      - 'scripts/java_example_regions.py'
      - 'scripts/java_ast.py'
      # The shared Java parser and grammar are resolved from this locked uv
      # project before either source-copy checker runs.
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pom.xml'
      - '**/pom.xml'
      - 'tools/**'
      - 'mvnw'
      - '.mvn/**'
  workflow_dispatch:

# No concurrency group here: inside a workflow_call, github.workflow is the
# caller's name, so a group defined here would collide with every sibling
# ci.yaml calls. ci.yaml owns concurrency for pull requests.

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hugo ignores GOMODCACHE and keeps modules under its own cache directory,
      # so this is the path worth caching between runs.
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hugo and Go both come from mise.toml, so their versions are declared
      # once and are the same locally and here — this used to be a HUGO_VERSION
      # env carrying a "keep in sync with mise.toml" comment, which is the
      # duplication this shape removes (#111). Hugo shells out to go to resolve
      # hugo-book as a Hugo module, and hugo-book needs the extended build for
      # SCSS; install_args names both because mise.toml pins the tools every
      # recipe needs, and this job wants none of the others *from mise*.
      #
      # java joins them because the site's API reference is generated by Maven
      # (#88). It comes from mise rather than from actions/setup-java so that
      # this job keeps exactly one tool installer for the JDK, which is also
      # what keeps the sentence below true — mise is safe here in a way it would
      # not be in verify.yaml: there is no setup-java for its java shim to shadow.
      # Maven itself is not installed; the recipe uses the ./mvnw wrapper.
      #
      # Go now comes from mise.toml rather than from `go-version-file:
      # docs/go.mod`, so the two no longer follow each other automatically. They
      # agree today (mise's `go = "1.26"` resolves to 1.26.5, which is what
      # docs/go.mod asks for) and a go.mod bump past what mise resolves fails
      # this job loudly, with docs/** in the paths filter so it fails on the
      # commit that caused it.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: hugo-extended go java uv

      # just comes from install-action even though mise is right above it, so
      # that every workflow installs it the same way. See the note in verify.yaml.
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: just

      # Keyed on mise.toml because that is now where the Hugo version lives, so
      # a version bump still invalidates the cache. Hashing the whole file means
      # a shellcheck or java bump invalidates it too — a cold module fetch of a
      # few seconds, on a file that changes rarely, in exchange for not parsing
      # a version out of it here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('mise.toml') }}-${{ hashFiles('docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('mise.toml') }}-

      # Generating the API reference resolves the whole libraries-bom tree, so
      # the Maven repository is worth caching. verify.yaml caches it through an
      # explicit actions/cache pair with restore-keys and a main-only save (its
      # comments say why setup-java's `cache: maven` was rejected there); here
      # the JDK comes from mise anyway, so the explicit action is the only
      # option. ~/.m2/wrapper joins it because the wrapper is
      # `distributionType=only-script`, so Maven itself is downloaded per run and
      # unpacked outside the repository directory.
      #
      # The negation line was written to keep this project's own artifacts from
      # being restored from a previous run — but under the pinned action it is a
      # no-op (verify.yaml's cache comment carries the measurement: the matched
      # ~/.m2/repository is archived recursively, so a subdirectory negation
      # removes nothing). What actually keeps the bare `javadoc:aggregate` in
      # `just docs-javadoc` resolving modules from the reactor is that nothing
      # here installs them; a cached SNAPSHOT is exactly what would make that
      # goal pass for the wrong reason if an install step ever appeared.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/io/github/flink-gcp
          key: maven-docs-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-docs-

      # The API reference is generated before the site because Hugo copies it
      # out of docs/static/ as part of the build.
      - name: Generate API reference
        run: just docs-javadoc

      # This also checks the exact source backing of runnable Java guidance and
      # plans or executes every source-backed SQL example.
      # See the maintain-doc-java-snippets, maintain-javadoc-examples and
      # maintain-doc-sql-snippets skills.
      - name: Check documentation snippets
        run: just check-doc-sql-snippets

      # Exercise the repository shortcode against synthetic pages and Java
      # sources, including every validation failure branch.
      - name: Test Java snippet shortcode
        run: just test-java-snippet-shortcode

      - name: Test SQL snippet shortcode
        run: just test-sql-snippet-shortcode

      # Uploaded from this job rather than rebuilt in `deploy` because
      # docs/public is only complete when `just docs-javadoc` ran first, in
      # this job: the API reference is generated, not committed (#88). A deploy
      # job that rebuilt the site on its own would publish one whose API
      # reference is silently missing, with dead links into it and nothing
      # failing.
      #
      # Unconditional, including on the pull requests where nothing will deploy
      # it: packaging then runs on the path every pull request takes, so a
      # docs/public that has moved or outgrown the Pages limit fails on the
      # change that did it rather than after merge. Measured at 31 MB, 4.3 MB
      # packed — most of it the generated API reference, against the 1 GB a
      # published Pages site may not exceed.
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  # Only the default branch publishes (#93). The ref alone decides it: inside a
  # workflow_call `github.ref` is the caller's, which for the pull requests
  # ci.yaml runs is `refs/pull/N/merge` (measured, and recorded in verify.yaml
  # beside the cache key that depends on it), so pull requests are excluded
  # without naming the event — as is the v1.20 branch, which has no published
  # line of its own until #731 says otherwise. `docs_passed` below holds the
  # other direction: that this job does not skip on a run that should have
  # published.
  deploy:
    name: Deploy documentation site
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declared on the job rather than at the top of this file so that the build
    # job above — the one pull requests run — keeps only `contents: read`.
    permissions:
      pages: write
      id-token: write
    # Job-level for the reason the note at the top of this file gives.
    # `cancel-in-progress: false` lets a deployment already publishing finish
    # rather than be interrupted part-way, which is what GitHub's own Pages
    # guidance sets it for. It does not make a queue of three safe: a *pending*
    # member of a concurrency group is cancelled when a newer one arrives
    # whatever this is set to, so the middle push's `deploy` reports
    # `cancelled` and reddens its own `docs_passed`, even though the newest
    # push goes on to publish that content anyway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails loudly when Pages is not enabled for the repository — the one
      # part of this setup that lives in repository settings rather than here.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # This workflow's own verdict, for the reason verify.yaml's carries one: a
  # failed job already fails the workflow, but a `deploy` that skipped on a run
  # which should have published would not, and a documentation site that
  # silently stops updating has no other signal at all — the same shape as the
  # owner-pinned `if:` guards that went quietly false when this repository
  # moved organisation. SKIPPED_OK carries the one thing derivation cannot
  # know, which run legitimately publishes nothing; it is the negation of
  # `deploy`'s condition above and has to be read against it. The non-empty
  # string goes in the *middle* of the `&& ||` pair, as verify.yaml's and
  # tofu-plan.yaml's do: written the other way round the middle operand is
  # `''`, which is falsy, so the expression yields the right-hand side on both
  # branches and the verdict silently permits every skip.
  docs_passed:
    name: Docs passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED_OK: ${{ github.ref != 'refs/heads/main' && 'deploy' || '' }}
        run: scripts/ci-gate.py
