name: Docs

on:
  push:
    branches:
      - main
      - v1.20
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: '0.164.0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Hugo resolves the hugo-book theme as a Hugo module, which needs Go.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: docs/go.sum

      # Installed from the official release rather than through a third-party
      # action, so the only trusted publishers are GitHub and Hugo itself.
      # hugo-book requires the extended build (SCSS).
      - name: Install Hugo
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      # --panicOnWarning turns deprecations, unresolved relrefs and missing
      # shortcodes into build failures. The site is not published yet (GitHub
      # Pages needs the repository to be public), so this is a check only.
      - name: Build
        run: hugo --gc --minify --source docs --panicOnWarning
