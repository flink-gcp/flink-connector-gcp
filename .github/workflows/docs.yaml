name: Docs

on:
  push:
    branches:
      - main
      - v1.20
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in sync with mise.toml. hugo-book needs the extended build (SCSS).
      HUGO_VERSION: '0.164.0'
      # Hugo ignores GOMODCACHE and keeps modules under its own cache directory,
      # so this is the path worth caching between runs.
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Hugo shells out to the go command to resolve the hugo-book module.
      # setup-go's own module cache is useless here (Hugo does not use
      # GOMODCACHE), so it is switched off in favour of the Hugo cache below.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: docs/go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('docs/go.sum') }}
          restore-keys: hugo-${{ env.HUGO_VERSION }}-

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # --panicOnWarning turns deprecations, unresolved relrefs and missing
      # shortcodes into build failures. The site is not published yet (GitHub
      # Pages needs the repository to be public), so this is a check only.
      - name: Build
        run: hugo --gc --minify --source docs --panicOnWarning
