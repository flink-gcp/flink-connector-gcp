name: Docs

on:
  push:
    branches:
      - main
      - v1.20
    paths: &docs_paths
      - 'docs/**'
      # A hugo or go version bump must build the site, and mise.toml is where
      # those versions are declared — the same reasoning as lint.yaml. The
      # justfile is here because it holds the build command.
      - 'mise.toml'
      - 'justfile'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hugo ignores GOMODCACHE and keeps modules under its own cache directory,
      # so this is the path worth caching between runs.
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hugo and Go both come from mise.toml, so their versions are declared
      # once and are the same locally and here — this used to be a HUGO_VERSION
      # env carrying a "keep in sync with mise.toml" comment, which is the
      # duplication this shape removes (#111). Hugo shells out to go to resolve
      # hugo-book as a Hugo module, and hugo-book needs the extended build for
      # SCSS; install_args names both because mise.toml pins the tools every
      # recipe needs, and this job wants none of the others *from mise*.
      #
      # mise is safe here in a way it would not be in ci.yaml: there is no
      # setup-java for its java shim to shadow.
      #
      # Go now comes from mise.toml rather than from `go-version-file:
      # docs/go.mod`, so the two no longer follow each other automatically. They
      # agree today (mise's `go = "1.26"` resolves to 1.26.5, which is what
      # docs/go.mod asks for) and a go.mod bump past what mise resolves fails
      # this job loudly, with docs/** in the paths filter so it fails on the
      # commit that caused it.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: hugo-extended go

      # just comes from install-action even though mise is right above it, so
      # that every workflow installs it the same way. See the note in ci.yaml.
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just

      # Keyed on mise.toml because that is now where the Hugo version lives, so
      # a version bump still invalidates the cache. Hashing the whole file means
      # a shellcheck or java bump invalidates it too — a cold module fetch of a
      # few seconds, on a file that changes rarely, in exchange for not parsing
      # a version out of it here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('mise.toml') }}-${{ hashFiles('docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('mise.toml') }}-

      # --panicOnWarning turns deprecations, unresolved relrefs and missing
      # shortcodes into build failures. The site is not published yet (GitHub
      # Pages needs the repository to be public), so this is a check only.
      - name: Build
        run: just docs
