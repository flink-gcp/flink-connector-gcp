name: Docs

on:
  push:
    branches:
      - main
      - v1.20
    paths: &docs_paths
      - 'docs/**'
      # A hugo or go version bump must build the site, and mise.toml is where
      # those versions are declared — the same reasoning as lint.yaml. The
      # justfile is here because it holds the build command.
      - 'mise.toml'
      - 'justfile'
      - '.github/workflows/docs.yaml'
      # The site contains a generated API reference (#88), so the main sources
      # and the Maven build are inputs to it exactly as docs/ is — the same rule
      # that puts mise.toml above. The root pom.xml is listed separately because
      # GitHub reads `**` as "any character, including /", so `**/pom.xml` needs
      # a slash before it and never matches a path without one — and the root
      # pom is where every javadoc setting lives. Generating the reference also
      # forks the reactor's compile phase, which runs checkstyle and spotless at
      # validate: checkstyle reads tools/maven/checkstyle.xml and
      # suppressions.xml from this repository, so tools/** is an input too;
      # spotless is configured entirely in the parent POM, so it adds nothing.
      - '**/src/main/**'
      - 'pom.xml'
      - '**/pom.xml'
      - 'tools/**'
      - 'mvnw'
      - '.mvn/**'
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hugo ignores GOMODCACHE and keeps modules under its own cache directory,
      # so this is the path worth caching between runs.
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hugo and Go both come from mise.toml, so their versions are declared
      # once and are the same locally and here — this used to be a HUGO_VERSION
      # env carrying a "keep in sync with mise.toml" comment, which is the
      # duplication this shape removes (#111). Hugo shells out to go to resolve
      # hugo-book as a Hugo module, and hugo-book needs the extended build for
      # SCSS; install_args names both because mise.toml pins the tools every
      # recipe needs, and this job wants none of the others *from mise*.
      #
      # java joins them because the site's API reference is generated by Maven
      # (#88). It comes from mise rather than from actions/setup-java so that
      # this job keeps exactly one tool installer for the JDK, which is also
      # what keeps the sentence below true — mise is safe here in a way it would
      # not be in ci.yaml: there is no setup-java for its java shim to shadow.
      # Maven itself is not installed; the recipe uses the ./mvnw wrapper.
      #
      # Go now comes from mise.toml rather than from `go-version-file:
      # docs/go.mod`, so the two no longer follow each other automatically. They
      # agree today (mise's `go = "1.26"` resolves to 1.26.5, which is what
      # docs/go.mod asks for) and a go.mod bump past what mise resolves fails
      # this job loudly, with docs/** in the paths filter so it fails on the
      # commit that caused it.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: hugo-extended go java

      # just comes from install-action even though mise is right above it, so
      # that every workflow installs it the same way. See the note in ci.yaml.
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: just

      # Keyed on mise.toml because that is now where the Hugo version lives, so
      # a version bump still invalidates the cache. Hashing the whole file means
      # a shellcheck or java bump invalidates it too — a cold module fetch of a
      # few seconds, on a file that changes rarely, in exchange for not parsing
      # a version out of it here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('mise.toml') }}-${{ hashFiles('docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('mise.toml') }}-

      # Generating the API reference resolves the whole libraries-bom tree, so
      # the Maven repository is worth caching. ci.yaml gets this from
      # actions/setup-java's `cache: maven`, which is not available here because
      # the JDK comes from mise. ~/.m2/wrapper joins it because the wrapper is
      # `distributionType=only-script`, so Maven itself is downloaded per run and
      # unpacked outside the repository directory.
      #
      # This project's own artifacts are excluded so that they can never be
      # restored from a previous run. Nothing here installs them today, so the
      # bare `javadoc:aggregate` in `just docs-javadoc` resolves the modules from
      # the reactor and only from there; the exclusion keeps that a property of
      # the configuration rather than of the current step list, because a cached
      # SNAPSHOT is exactly what would make that goal pass for the wrong reason.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/io/github/flink-gcp
          key: maven-docs-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-docs-

      # The API reference is generated before the site because Hugo copies it
      # out of docs/static/ as part of the build.
      - name: Generate API reference
        run: just docs-javadoc

      # --panicOnWarning turns deprecations, unresolved relrefs and missing
      # shortcodes into build failures. The site is not published yet (GitHub
      # Pages needs the repository to be public), so this is a check only.
      - name: Build
        run: just docs
