name: Docs

on:
  workflow_call:
  push:
    branches: [main, v1.20]
    paths:
      - 'docs/**'
      # A hugo or go version bump must build the site, and mise.toml is where
      # those versions are declared — the same reasoning as lint.yaml. The
      # justfile is here because it holds the build command.
      - 'mise.toml'
      - 'justfile'
      # This helper runs the synthetic fixture site below; docs/** already
      # carries the fixtures and repository shortcode it exercises.
      - 'scripts/test-java-snippet-shortcode.sh'
      - 'scripts/test-sql-snippet-shortcode.sh'
      - '.github/workflows/docs.yaml'
      - 'scripts/docs-site.py'
      # The site contains a generated API reference (#88), so the main sources
      # and the Maven build are inputs to it exactly as docs/ is — the same rule
      # that puts mise.toml above. The root pom.xml is listed separately because
      # GitHub reads `**` as "any character, including /", so `**/pom.xml` needs
      # a slash before it and never matches a path without one — and the root
      # pom is where every javadoc setting lives. Generating the reference also
      # forks the reactor's compile phase, which runs checkstyle and spotless at
      # validate: checkstyle reads tools/maven/checkstyle.xml and
      # suppressions.xml from this repository, so tools/** is an input too;
      # spotless is configured entirely in the parent POM, so it adds nothing.
      - '**/src/main/**'
      # Source-backed Java examples live in an internal test-only module rather
      # than below docs/, so their push must run both compilation and rendering.
      - 'flink-connector-gcp-docs-validation/src/test/**'
      # Spanner GoogleSQL examples are executed against the emulator from
      # their source regions before Hugo renders them. These resources, the
      # named test, and its emulator base define that documentation boundary.
      # Other Spanner test sources are reactor compilation collateral rather
      # than inputs that change the site or its source-backed examples.
      - 'flink-connector-gcp-spanner/src/test/resources/sql-snippets/**'
      - 'flink-connector-gcp-spanner/src/test/java/io/github/flink/gcp/connector/spanner/SpannerDocumentationSqlITCase.java'
      - 'flink-connector-gcp-spanner/src/test/java/io/github/flink/gcp/connector/spanner/AbstractSpannerEmulatorITCase.java'
      # Module READMEs retain ordinary fences for GitHub, and the checker keeps
      # those copies synchronized with compiled sources.
      - 'flink-*/README.md'
      - 'scripts/check-readme-examples.py'
      # Public Javadoc blocks map to compiled sources through this checker.
      - 'scripts/check-javadoc-examples.py'
      # Both source-copy checkers share the Java tagged-region parser.
      - 'scripts/java_example_regions.py'
      - 'scripts/java_ast.py'
      # The shared Java parser and grammar are resolved from this locked uv
      # project before either source-copy checker runs.
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pom.xml'
      - '**/pom.xml'
      - 'tools/**'
      - 'mvnw'
      - '.mvn/**'
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

# Serialize the whole publication, including release discovery. Resolve main
# only once this run starts, so a delayed event cannot publish an older tree.
# PR groups differ from ci.yaml's group; reusable siblings cannot collide.
# Failed releases and dry runs get their own group and cannot displace a
# pending publication. GitHub retains only the newest pending group member.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'docs-publication' || format('docs-check-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Select documentation versions
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      controller_sha: ${{ steps.plan.outputs.controller_sha }}
      publish: ${{ github.repository_id == '1305440656' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/docs-site.py plan "$RUNNER_TEMP/docs-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}/docs-plan.json

  build:
    name: Build documentation (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: controller
    env:
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      # Use each source tree's toolchain; the controller only assembles metadata.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: source
          install_args: hugo-extended go java uv node
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ hashFiles('source/mise.toml') }}-${{ hashFiles('source/docs/go.sum') }}
          restore-keys: hugo-${{ hashFiles('source/mise.toml') }}-
      # No build installs project artifacts into the repository. Do not add
      # install steps here: aggregate Javadoc must resolve siblings in its reactor.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-docs-${{ hashFiles('source/**/pom.xml') }}
          restore-keys: maven-docs-
      - name: Test documentation version rendering
        if: matrix.id == 'development'
        run: just test-doc-versions
      - name: Build and validate the selected source
        env:
          DOCS_VERSION: ${{ matrix.id }}
        run: just docs-site build "$RUNNER_TEMP/docs-plan.json" "$DOCS_VERSION" "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/line"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-line-${{ matrix.id }}
          path: ${{ runner.temp }}/line

  assemble:
    name: Assemble documentation site
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-line-*
          merge-multiple: true
          path: ${{ runner.temp }}/lines
      - name: Assemble every planned version
        run: python3 scripts/docs-site.py assemble "$RUNNER_TEMP/docs-plan.json" "$RUNNER_TEMP/lines" "$RUNNER_TEMP/site"
      # PRs package the same combined artifact as publication, including all
      # retained releases, navigation, redirects and the generated API reference.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy documentation site
    needs: [plan, assemble]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  docs_passed:
    name: Docs passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, build, assemble, deploy]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate every job result
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED_OK: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push') && 'plan build assemble deploy' || (needs.plan.outputs.publish != 'true' && 'deploy' || '') }}
        run: scripts/ci-gate.py
