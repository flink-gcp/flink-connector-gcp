name: CI

# The pull-request orchestrator and the one check branch protection requires
# (issues #243, #250; the shape is suzuki-shunsuke's required-status-check
# pattern, decided with the user on PR #305): every PR-facing workflow runs
# as a reusable workflow called from here, and the `CI passed` gate `needs`
# them all — which is the only way a verdict can span workflows, since
# `needs` cannot cross workflow files. What main requires is therefore
# decided in this file alone: a workflow enrolls by joining the gate's
# `needs`, with no branch-protection edit, no required context left to fall
# silently out of step with a renamed job (a stale `needs` entry or `uses`
# path is a workflow-parse error no run survives unnoticed), and no
# paths-filter trap — a required check that never reports blocks a pull
# request forever, so this workflow carries no filter at all and each child
# does its own change detection at job level (verify's `changes` job,
# tfaction's `list-targets`). That is also what an auto-merge story needs.
#
# The children keep their own push/workflow_dispatch triggers and their
# push-side paths filters; those are cost-saving only, protection lives here.
on:
  pull_request:

# The one concurrency group, deliberately not in the children: inside a
# workflow_call, github.workflow is this workflow's name, so a group defined
# in a child would collide with its siblings and they would cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# A called workflow's job-level permissions must fit inside what its caller
# grants, so each job here grants exactly what its child asks for.
jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read

  lint:
    uses: ./.github/workflows/lint.yaml
    permissions:
      contents: read

  docs:
    uses: ./.github/workflows/docs.yaml
    permissions:
      contents: read

  # tfcmt posts the plan comment (pull-requests: write) and WIF mints the
  # GCP token (id-token: write). On a fork pull request the token is
  # read-only regardless, so the comment steps would fail — irrelevant while
  # the repository is private, and a named checklist item for going public
  # (issue #6).
  tofu_plan:
    uses: ./.github/workflows/tofu-plan.yaml
    permissions:
      contents: read
      pull-requests: write
      id-token: write

  # The gate. It reports on every uncancelled run — an explicit green or an
  # explicit red, never a skip GitHub would count as satisfied — and its
  # verdict is derived from the whole `needs` context, so there is no second
  # list to maintain. None of the children may skip (their internal skips
  # are judged inside them, by their own verdict jobs); the truth table
  # lives in scripts/ci-gate.py so it can be run by hand, and the wiring
  # tests in scripts/tests/test_ci_gate.py hold the `needs` list to the job
  # list above.
  ci_passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify, lint, docs, tofu_plan]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate every workflow result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.py
