name: CI

on:
  push:
    branches:
      - main
      - v1.20
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Spotless and checkstyle cover the Java sources, but nothing covered scripts/.
  # actionlint shellchecks a workflow's inline `run:` blocks, so extracting a
  # script into a file of its own would otherwise quietly drop it out of linting.
  #
  # A separate job so the result arrives in seconds instead of behind the
  # integration tests, and so mise's shims never share a PATH with setup-java's
  # JDK in the build job.
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install_args limits this to shellcheck — mise.toml also pins java, maven,
      # hugo and go, none of which this job needs. The version comes from
      # mise.toml, so it is declared once and is the same locally and here. The
      # action caches the install by default, keyed partly on install_args.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs the full lifecycle: spotless/checkstyle (validate), compile,
      # unit tests (test), packaging, integration tests (integration-test)
      # and the apache-rat license-header check (verify). Integration tests
      # use testcontainers-based emulators and require no cloud credentials,
      # so this job is safe to run on any pull request.
      - name: Build and verify
        run: ./mvnw -ntp verify
