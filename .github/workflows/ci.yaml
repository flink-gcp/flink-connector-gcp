name: CI

on:
  push:
    branches:
      - main
      - v1.20
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Spotless and checkstyle cover the Java sources, but nothing covered
      # scripts/ — actionlint shellchecks a workflow's inline `run:` blocks, so
      # moving a script into a file of its own would otherwise quietly drop it
      # out of linting. Runs before the build so it fails in seconds rather than
      # after the integration tests. shellcheck ships with the runner image, so
      # this needs no action and no install.
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs the full lifecycle: spotless/checkstyle (validate), compile,
      # unit tests (test), packaging, integration tests (integration-test)
      # and the apache-rat license-header check (verify). Integration tests
      # use testcontainers-based emulators and require no cloud credentials,
      # so this job is safe to run on any pull request.
      - name: Build and verify
        run: ./mvnw -ntp verify
