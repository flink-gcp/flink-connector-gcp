name: CI

on:
  push:
    branches:
      - main
      - v1.20
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Java sources only: spotless and checkstyle run inside `verify`. scripts/ and
  # anything else Maven does not see are linted by lint.yaml.
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # install-action rather than mise: this drops one binary on PATH and
      # creates no shims at all, which is the simplest thing that can work in a
      # job that also runs setup-java. mise would work too — mise.toml pins java
      # and maven, so its shims lead the JDK by default, but add_shims_to_path:
      # false turns that off. install-action is preferred here for having
      # nothing to turn off, not because the two cannot be combined.
      #
      # `tool: just` carries no version on purpose. install-action reads no
      # version file, so pinning it would mean an inline version in six places
      # to keep in sync with mise.toml — and the reason shellcheck *is* pinned
      # (a newer release adds checks that fail a pull request which changed
      # nothing) has no analogue here: just guarantees no 1.x release breaks an
      # existing justfile or a working command line, and that there will never
      # be a 2.0. mise.toml says `just = "1"`, so both sides mean the same
      # thing. The guarantee covers stable features only, which is why nothing
      # CI runs uses a `--unstable` one — see the lint recipe.
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: just

      # Runs the full lifecycle: spotless/checkstyle (validate), compile,
      # unit tests (test), packaging, integration tests (integration-test)
      # and the apache-rat license-header check (verify). Integration tests
      # use testcontainers-based emulators and require no cloud credentials,
      # so this job is safe to run on any pull request.
      - name: Build and verify
        run: just verify
