name: Renovate emulator images

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:

concurrency:
  group: renovate-emulator-images
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    # The immutable ID excludes forks while surviving a rename or transfer.
    if: github.repository_id == '1305440656' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The App's pull requests start the ordinary CI workflows (ADR-0121).
      # Missing or invalid credentials must fail this scheduled job.
      - name: Mint an App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose emulator image updates
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          # Loaded before Renovate clones the repository; a repository-only
          # remap cannot report failures that prevent reading that config.
          RENOVATE_CONFIG: >-
            {"logLevelRemap":[{"matchMessage":"/^(Failed to look up docker package |Host error$|Git error - aborting$|Repository is disabled - skipping$|Repository has invalid config$)/","newLogLevel":"error"}]}
