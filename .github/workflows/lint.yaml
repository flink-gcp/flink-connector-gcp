name: Lint

# Linters for the parts of the repository Maven does not cover. Spotless and
# checkstyle handle the Java sources inside `just verify` (ci.yaml); this is
# where everything else goes — shellcheck and actionlint today, and
# `tofu fmt`/`validate` once the OpenTofu persistent layer lands (#5).
#
# Split out of ci.yaml so it reports in seconds instead of behind the
# integration tests, and so mise's shims never share a PATH with setup-java's
# JDK in the build job.
on:
  push:
    branches:
      - main
      - v1.20
    paths: &lint_paths
      - 'scripts/**'
      # actionlint lints every workflow, so every workflow is an input here —
      # not just this one.
      - '.github/workflows/**'
      # The justfile is deliberately absent: `just lint` runs no linter over it
      # (see the note on the recipe), so it is the thing that invokes a lint
      # here, not an input to one.
      # A shellcheck or actionlint version bump must run them. mise.toml is
      # where those versions are declared, so leaving it out would skip the lint
      # in exactly the change that most needs it.
      - 'mise.toml'
  pull_request:
    paths: *lint_paths
  workflow_dispatch:

# NOTE: the paths filter means pull requests that touch none of the above never
# report this workflow at all. That is fine while it is optional, but a required
# check that never reports blocks a pull request forever — so making this one
# required means either dropping the filter or adding a job that reports success
# when the filter does not match. Same exposure as docs.yaml.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install_args limits this to the two linters — mise.toml pins the tools
      # every recipe needs, and this job wants none of the others. Their
      # versions come from mise.toml, so they are declared once and are the same
      # locally and here, and not the runner image's copy: its shellcheck is
      # 0.9.0 on ubuntu-24.04 and 0.11.0 on 26.04, so an ubuntu-latest migration
      # would fail a pull request that changed nothing. The action caches the
      # install by default, keyed partly on install_args.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: shellcheck actionlint

      # just comes from install-action even though mise is right here, so that
      # every workflow installs it the same way. See the note in ci.yaml.
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: just

      - name: Run the linters
        run: just lint
