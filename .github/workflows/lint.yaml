name: Lint

# Linters for the parts of the repository Maven does not cover. Spotless and
# checkstyle handle the Java sources inside `just verify` (verify.yaml); this
# is where everything else goes — shellcheck, ruff, actionlint, markdownlint
# and `tofu fmt -check` today (`tofu validate` is subsumed by the plan the
# tofu-plan workflow runs whenever a pull request touches opentofu/).
#
# A workflow of its own rather than jobs in verify.yaml so it reports in
# seconds instead of behind the integration tests. On pull requests it runs
# as a reusable workflow called by ci.yaml, with no filter at all — its
# failures redden the required `CI passed` gate there. The push-side paths
# filter below is cost-saving only, and protection does not rest on it.
on:
  workflow_call:
  push:
    branches:
      - main
      - v1.20
    paths:
      - 'scripts/**'
      # actionlint lints every workflow, so every workflow is an input here —
      # not just this one.
      - '.github/workflows/**'
      # The justfile is deliberately absent: `just lint` runs no linter over it
      # (see the note on the recipe), so it is the thing that invokes a lint
      # here, not an input to one.
      # A shellcheck or actionlint version bump must run them. mise.toml is
      # where those versions are declared, so leaving it out would skip the lint
      # in exactly the change that most needs it.
      - 'mise.toml'
      # The scripts test suite's remaining inputs: the uv project at the
      # repository root (a pytest bump lands in these two files and must run
      # the suite, for the same reason mise.toml is listed), and the poms and
      # NOTICE.template markers the suite's real-repo CLI tests assert
      # against — a new module or inter-module edge changes the deriver's
      # expected output, and the stale expectation must fail on the pull
      # request that made it stale, not on the next one to touch scripts/.
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pom.xml'
      - 'flink-*/pom.xml'
      - 'flink-*/NOTICE.template'
      # tofu fmt -check reads these (opentofu/README.md doubles as markdownlint
      # input).
      - 'opentofu/**'
      # markdownlint reads its config and the rendered markdown — the docs
      # sources, the ADRs and the READMEs. CLAUDE.md files are deliberately
      # outside its globs (see .markdownlint-cli2.jsonc), so they are not
      # inputs here.
      - '.markdownlint-cli2.jsonc'
      - 'docs/content/**'
      - 'docs/adr/**'
      - 'README.md'
      - 'flink-*/README.md'
  workflow_dispatch:

# No concurrency group here: inside a workflow_call, github.workflow is the
# caller's name, so a group defined here would collide with every sibling
# ci.yaml calls. ci.yaml owns concurrency for pull requests.

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install_args limits this to the linters — mise.toml pins the tools
      # every recipe needs, and this job wants none of the others. Their
      # versions come from mise.toml, so they are declared once and are the same
      # locally and here, and not the runner image's copy: its shellcheck is
      # 0.9.0 on ubuntu-24.04 and 0.11.0 on 26.04, so an ubuntu-latest migration
      # would fail a pull request that changed nothing. The action caches the
      # install by default, keyed partly on install_args.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: shellcheck actionlint ruff opentofu node npm:markdownlint-cli2

      # just comes from install-action even though mise is right here, so that
      # every workflow installs it the same way. See the note in verify.yaml.
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just

      - name: Run the linters
        run: just lint

  # The scripts/tests suite (PR #247): pytest over the CI deriver and the CI
  # gate. Here rather than in verify.yaml because its inputs are all in this
  # workflow's push-side paths — scripts/** carries the code and the tests, the root
  # pyproject.toml and uv.lock carry the project, mise.toml carries the uv
  # pin — and because it reports in seconds beside the linters. uv resolves
  # the interpreter itself (managed download on a bare runner), so mise
  # installs nothing but uv here.
  script_tests:
    name: Test the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: uv

      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just

      - name: Run the scripts test suite
        run: just test-scripts
