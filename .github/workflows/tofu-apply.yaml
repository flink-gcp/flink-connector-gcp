name: OpenTofu apply

# Applies the opentofu/ configuration after a merge to main, reusing the plan
# file the pull request reviewed (downloaded from GitHub Artifacts), and posts
# the result as a comment on that pull request. See tofu-plan.yaml for the
# shared design notes and security model; the difference here is the service
# account — the managing one, whose WIF binding only a push to main can use.
on:
  push:
    branches:
      - main
    # tofu-plan.yaml has no paths of its own to mirror any more — it runs under
    # ci.yaml (see the note there). What this list must not miss is any path a
    # merge could carry a reviewed plan for: 'opentofu/**' is a superset of
    # tfaction's root-module markers, and the rest are the inputs that decide
    # how a plan is produced. ci.yaml is deliberately absent although the plan
    # now runs under it — a change to it alone selects no target, so it could
    # only start applies with nothing to apply.
    paths:
      - 'opentofu/**'
      - 'tfaction-root.yaml'
      - '.github/workflows/tofu-plan.yaml'
      - '.github/workflows/tofu-apply.yaml'
      - '.github/workflows/tofu-list.yaml'
      - 'mise.toml'

# Applies queue rather than cancel: interrupting an apply mid-flight is worse
# than running two in sequence, and the GCS state lock serializes them anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The one line that makes this the APPLY workflow. tfaction's job_type stays
# "terraform" for plan and apply alike; setup selects terraform_apply_config —
# the managing service account — only when TFACTION_IS_APPLY is "true"
# (getJobConfig in tfaction's lib). Without it, setup silently falls back to
# terraform_plan_config, and every apply here ran as the read-only plan
# account: unnoticed for as long as every apply was a no-change apply (reads
# suffice for those), then #170 and #176 — the first applies that had to
# write — failed all their writes with 403s that were misread twice before
# the auth step's log gave up the wrong principal.
env:
  TFACTION_IS_APPLY: "true"

permissions: {}

jobs:
  list:
    uses: ./.github/workflows/tofu-list.yaml
    permissions:
      contents: read
      pull-requests: read

  apply:
    name: tofu apply (${{ matrix.target.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [list]
    if: join(fromJSON(needs.list.outputs.targets), '') != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    permissions:
      contents: read
      # tfcmt posts the apply result on the merged pull request.
      pull-requests: write
      # Download the plan artifact the pull request's plan job uploaded.
      actions: read
      # Mint the GitHub OIDC token that WIF exchanges for GCP credentials.
      id-token: write
    env:
      TFACTION_TARGET: ${{ matrix.target.target }}
      TFACTION_WORKING_DIR: ${{ matrix.target.working_directory }}
      TFACTION_JOB_TYPE: ${{ matrix.target.job_type }}
      # The `secrets` context is unavailable in a step's `if:`, so the
      # precondition becomes a job-level flag. A flag rather than the key
      # itself: this puts "are both credentials present" into every step's
      # environment without putting the key there.
      APP_CREDENTIALS: ${{ (vars.BOT_APP_ID != '' && secrets.BOT_APP_PRIVATE_KEY != '') && 'yes' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: opentofu

      - name: Set up tfaction
        id: setup
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: setup
          github_token: ${{ github.token }}

      - name: Authenticate to Google Cloud
        if: steps.setup.outputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: tofu init
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: terraform-init
          github_token: ${{ github.token }}

      - name: tofu apply
        id: apply
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: apply
          github_token: ${{ github.token }}

      # A failed apply has bumped the state serial, so the plan file this job
      # downloaded is stale and re-running the job can only fail again. The
      # recovery is a follow-up pull request whose fresh plan picks up the
      # remainder, which tfaction now opens instead of it being written by hand
      # (ADR-0121). opentofu/README.md carries what the pull request looks like
      # and what to do with it.
      #
      # Keyed on the apply step failing, not on `failure()` alone: auth and init
      # run before it and touch no state, so a WIF or state-lock flake there
      # would otherwise open a follow-up whose plan reports no change and tell
      # the merger to handle an apply that never ran. A push to main is never a
      # fork context, so the credential guard is only about the credentials
      # existing.
      - name: Mint an App token for the follow-up pull request
        id: app-token
        if: failure() && steps.apply.outcome == 'failure' && env.APP_CREDENTIALS != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create the follow-up pull request
        if: failure() && steps.app-token.outcome == 'success'
        uses: suzuki-shunsuke/tfaction@f62d11ce89de2aa26b00efaa266e449769f70442 # v2.1.0
        with:
          action: create-follow-up-pr
          github_token: ${{ steps.app-token.outputs.token }}

      # A new manually scaled App Engine version starts with one billed
      # instance. Stop it immediately after the apply, including after a
      # partially successful apply, rather than relying on the scheduled sweep.
      - name: Set up gcloud for App Engine cleanup
        if: always() && steps.setup.outcome == 'success'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Stop the App Engine E2E fixture
        if: always() && steps.setup.outcome == 'success'
        env:
          CLOUDTASKS_IT_PROJECT: flink-gcp
        run: scripts/appengine-e2e-fixture.sh stop
