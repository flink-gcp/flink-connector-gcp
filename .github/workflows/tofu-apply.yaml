name: OpenTofu apply

# Applies the opentofu/ configuration after a merge to main, reusing the plan
# file the pull request reviewed (downloaded from GitHub Artifacts), and posts
# the result as a comment on that pull request. See tofu-plan.yaml for the
# shared design notes and security model; the difference here is the service
# account — the managing one, whose WIF binding only a push to main can use.
on:
  push:
    branches:
      - main
    # Keep in sync with tofu-plan.yaml's paths (see the note there).
    paths:
      - 'opentofu/**'
      - 'tfaction-root.yaml'
      - '.github/workflows/tofu-plan.yaml'
      - '.github/workflows/tofu-apply.yaml'
      - '.github/workflows/tofu-list.yaml'
      - 'mise.toml'

# Applies queue rather than cancel: interrupting an apply mid-flight is worse
# than running two in sequence, and the GCS state lock serializes them anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The one line that makes this the APPLY workflow. tfaction's job_type stays
# "terraform" for plan and apply alike; setup selects terraform_apply_config —
# the managing service account — only when TFACTION_IS_APPLY is "true"
# (getJobConfig in tfaction's lib). Without it, setup silently falls back to
# terraform_plan_config, and every apply here ran as the read-only plan
# account: unnoticed for as long as every apply was a no-change apply (reads
# suffice for those), then #170 and #176 — the first applies that had to
# write — failed all their writes with 403s that were misread twice before
# the auth step's log gave up the wrong principal.
env:
  TFACTION_IS_APPLY: "true"

permissions: {}

jobs:
  list:
    uses: ./.github/workflows/tofu-list.yaml
    permissions:
      contents: read
      pull-requests: read

  apply:
    name: tofu apply (${{ matrix.target.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [list]
    if: join(fromJSON(needs.list.outputs.targets), '') != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    permissions:
      contents: read
      # tfcmt posts the apply result on the merged pull request.
      pull-requests: write
      # Download the plan artifact the pull request's plan job uploaded.
      actions: read
      # Mint the GitHub OIDC token that WIF exchanges for GCP credentials.
      id-token: write
    env:
      TFACTION_TARGET: ${{ matrix.target.target }}
      TFACTION_WORKING_DIR: ${{ matrix.target.working_directory }}
      TFACTION_JOB_TYPE: ${{ matrix.target.job_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: opentofu

      - name: Set up tfaction
        id: setup
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: setup
          github_token: ${{ github.token }}

      - name: Authenticate to Google Cloud
        if: steps.setup.outputs.gcp_workload_identity_provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: tofu init
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: terraform-init
          github_token: ${{ github.token }}

      - name: tofu apply
        uses: suzuki-shunsuke/tfaction@d0d52eb8b2ff13d6e27ac9653d038df384e58827 # v2.0.5
        with:
          action: apply
          github_token: ${{ github.token }}
