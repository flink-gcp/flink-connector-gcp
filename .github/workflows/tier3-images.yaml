name: Publish Tier-3 images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tier3-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_id == '1305440656' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GAR: us-central1-docker.pkg.dev/flink-gcp/flink-tier3
      OPERATOR_IMAGE: us-central1-docker.pkg.dev/flink-gcp/flink-tier3/operator:1.15.0
      FLINK_IMAGE: us-central1-docker.pkg.dev/flink-gcp/flink-tier3/flink:2.2.1
      # Single-platform linux/amd64 manifests: Operator 1.15.0 and Flink 2.2.1/Java 17.
      OPERATOR_SOURCE: docker.io/apache/flink-kubernetes-operator@sha256:2c667a1c14bdb7365f16811dd98a576d6e4993ccbcc369dc53fb75081116ee78
      FLINK_SOURCE: docker.io/library/flink@sha256:a093c60a9ab038f8821a3bfce4c3236ce37c2ac8e2a94f741f49cb1689baa3cd
    steps:
      - name: Check the reviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: crane cue java uv

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just

      - name: Verify the smoke application payload
        run: just tier3-smoke-verify

      - name: Export the locked lifecycle dependencies
        run: just tier3-lifecycle-requirements

      - name: Read the reviewed Flink base
        id: smoke_base
        run: |
          echo "image=$(cue -C kubernetes export ./images -e flink --out text)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.GAR }}/lifecycle-tools
          tags: type=sha,format=long

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-image-publisher@flink-gcp.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Mirror Operator and Flink
        run: |
          crane copy "$OPERATOR_SOURCE" "$OPERATOR_IMAGE"
          crane copy "$FLINK_SOURCE" "$FLINK_IMAGE"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: kubernetes/images/lifecycle
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: smoke_meta
        with:
          images: ${{ env.GAR }}/smoke
          tags: type=sha,format=long

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: smoke_build
        with:
          context: kubernetes/apps/smoke
          platforms: linux/amd64
          build-args: FLINK_IMAGE=${{ steps.smoke_base.outputs.image }}
          push: true
          tags: ${{ steps.smoke_meta.outputs.tags }}
          labels: ${{ steps.smoke_meta.outputs.labels }}

      - name: Show published image digests
        env:
          LIFECYCLE_DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_DIGEST: ${{ steps.smoke_build.outputs.digest }}
        run: |
          for image in "$OPERATOR_IMAGE" "$FLINK_IMAGE"; do
            digest="$(crane digest "$image")"
            printf '%s@%s\n\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '%s/lifecycle-tools@%s\n' "$GAR" "$LIFECYCLE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s/smoke@%s\n' "$GAR" "$SMOKE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
