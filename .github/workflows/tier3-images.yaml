name: Publish Tier-3 images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full reviewed main commit to publish
        required: true
        type: string
      # A trial needs only its own application's image. Every dispatch still copies
      # the Operator and Flink mirrors and builds the lifecycle-tools image, whose
      # pin a trial may need to renew.
      application:
        description: Application to verify and publish, or all of them
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - bigquery
          - pubsub
          - cloudtasks
          - bigtable
          - spanner
          - firestore

permissions:
  contents: read

concurrency:
  group: tier3-image-publication
  cancel-in-progress: false

# Every Maven run reads Google's mirror of Central first, and the wrapper fetches
# Maven itself from it: Central rate-limits GitHub-hosted runners (issue #1887).
# .github/maven/settings.xml says why it is a repository ahead of Central rather
# than a mirror of it.
env:
  MAVEN_ARGS: --settings ${{ github.workspace }}/.github/maven/settings.xml
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  publish:
    if: github.repository_id == '1305440656' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Seven application verifications, each building its connector with -am, bring an `all`
    # dispatch to about 32 minutes (25 for the six before Firestore's, whose own CI lane takes
    # about 7); this leaves room for a slow runner. One application takes a fraction of that.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GAR: us-central1-docker.pkg.dev/flink-gcp/flink-tier3
      OPERATOR_IMAGE: us-central1-docker.pkg.dev/flink-gcp/flink-tier3/operator:1.16.1
      FLINK_IMAGE: us-central1-docker.pkg.dev/flink-gcp/flink-tier3/flink:2.2.1
      # Single-platform linux/amd64 manifests: Operator 1.16.1 and Flink 2.2.1, Java 17.
      OPERATOR_SOURCE: docker.io/apache/flink-kubernetes-operator@sha256:91250bb08c4f1ea358b201680e355139a530cb7318439926d62c6387d7c1369d
      FLINK_SOURCE: docker.io/library/flink@sha256:a093c60a9ab038f8821a3bfce4c3236ce37c2ac8e2a94f741f49cb1689baa3cd
    steps:
      - name: Check the reviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml's java is Temurin 21, so the payloads build on JDK 21 with
      # maven.compiler.release 17 for the Java 17 image; the verify.yaml lanes
      # test the same applications on JDK 17 (#2132).
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: crane cue java uv

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      # The verify lanes' entry, restored only: every verification below builds a connector
      # and its application with -am, which that entry already resolves (issue #1887). The
      # paths are the saved entry's, negation included, because the cache's version derives
      # from them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
            !~/.m2/repository/io/github/flink-gcp
          key: maven-verify-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties', '.github/maven/settings.xml') }}
          restore-keys: maven-verify-

      - name: Verify the smoke application payload
        if: inputs.application == 'all' || inputs.application == 'smoke'
        run: just tier3-smoke-verify

      - name: Verify the BigQuery recovery payload
        if: inputs.application == 'all' || inputs.application == 'bigquery'
        run: just tier3-bigquery-verify

      - name: Read the reviewed recovery application base
        id: recovery_base
        run: |
          printf 'image=%s/flink@%s\n' "$GAR" "${FLINK_SOURCE##*@}" >> "$GITHUB_OUTPUT"

      - name: Verify the Pub/Sub recovery payload
        if: inputs.application == 'all' || inputs.application == 'pubsub'
        run: just tier3-pubsub-verify

      - name: Verify the Cloud Tasks recovery payload
        if: inputs.application == 'all' || inputs.application == 'cloudtasks'
        run: just tier3-cloudtasks-verify

      - name: Verify the Bigtable recovery payload
        if: inputs.application == 'all' || inputs.application == 'bigtable'
        run: just tier3-bigtable-verify

      - name: Verify the Spanner recovery payload
        if: inputs.application == 'all' || inputs.application == 'spanner'
        run: just tier3-spanner-verify

      - name: Verify the Firestore recovery payload
        if: inputs.application == 'all' || inputs.application == 'firestore'
        run: just tier3-firestore-verify

      - name: Export the locked lifecycle dependencies
        run: just tier3-lifecycle-requirements

      - name: Read the reviewed Flink base
        id: smoke_base
        if: inputs.application == 'all' || inputs.application == 'smoke'
        run: |
          echo "image=$(cue -C kubernetes export ./images -e flink --out text)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.GAR }}/lifecycle-tools
          tags: type=sha,format=long

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: tier3-image-publisher@flink-gcp.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Mirror Operator and Flink
        run: |
          crane copy "$OPERATOR_SOURCE" "$OPERATOR_IMAGE"
          crane copy "$FLINK_SOURCE" "$FLINK_IMAGE"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: kubernetes/images/lifecycle
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: smoke_meta
        if: inputs.application == 'all' || inputs.application == 'smoke'
        with:
          images: ${{ env.GAR }}/smoke
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: smoke_build
        if: inputs.application == 'all' || inputs.application == 'smoke'
        with:
          context: kubernetes/apps/smoke
          platforms: linux/amd64
          build-args: FLINK_IMAGE=${{ steps.smoke_base.outputs.image }}
          push: true
          tags: ${{ steps.smoke_meta.outputs.tags }}
          labels: ${{ steps.smoke_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: bigquery_meta
        if: inputs.application == 'all' || inputs.application == 'bigquery'
        with:
          images: ${{ env.GAR }}/bigquery-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: bigquery_build
        if: inputs.application == 'all' || inputs.application == 'bigquery'
        with:
          context: kubernetes/apps/bigquery
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.bigquery_meta.outputs.tags }}
          labels: ${{ steps.bigquery_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: pubsub_meta
        if: inputs.application == 'all' || inputs.application == 'pubsub'
        with:
          images: ${{ env.GAR }}/pubsub-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: pubsub_build
        if: inputs.application == 'all' || inputs.application == 'pubsub'
        with:
          context: kubernetes/apps/pubsub
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.pubsub_meta.outputs.tags }}
          labels: ${{ steps.pubsub_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: cloudtasks_meta
        if: inputs.application == 'all' || inputs.application == 'cloudtasks'
        with:
          images: ${{ env.GAR }}/cloudtasks-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: cloudtasks_build
        if: inputs.application == 'all' || inputs.application == 'cloudtasks'
        with:
          context: kubernetes/apps/cloudtasks
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.cloudtasks_meta.outputs.tags }}
          labels: ${{ steps.cloudtasks_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: bigtable_meta
        if: inputs.application == 'all' || inputs.application == 'bigtable'
        with:
          images: ${{ env.GAR }}/bigtable-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: bigtable_build
        if: inputs.application == 'all' || inputs.application == 'bigtable'
        with:
          context: kubernetes/apps/bigtable
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.bigtable_meta.outputs.tags }}
          labels: ${{ steps.bigtable_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: spanner_meta
        if: inputs.application == 'all' || inputs.application == 'spanner'
        with:
          images: ${{ env.GAR }}/spanner-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: spanner_build
        if: inputs.application == 'all' || inputs.application == 'spanner'
        with:
          context: kubernetes/apps/spanner
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.spanner_meta.outputs.tags }}
          labels: ${{ steps.spanner_meta.outputs.labels }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: firestore_meta
        if: inputs.application == 'all' || inputs.application == 'firestore'
        with:
          images: ${{ env.GAR }}/firestore-recovery
          tags: type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: firestore_build
        if: inputs.application == 'all' || inputs.application == 'firestore'
        with:
          context: kubernetes/apps/firestore
          platforms: linux/amd64
          build-args: |
            FLINK_IMAGE=${{ steps.recovery_base.outputs.image }}
            FLINK_VERSION=2.2.1
          push: true
          tags: ${{ steps.firestore_meta.outputs.tags }}
          labels: ${{ steps.firestore_meta.outputs.labels }}

      - name: Show published image digests
        env:
          APPLICATION: ${{ inputs.application }}
          LIFECYCLE_DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_DIGEST: ${{ steps.smoke_build.outputs.digest }}
          BIGQUERY_DIGEST: ${{ steps.bigquery_build.outputs.digest }}
          PUBSUB_DIGEST: ${{ steps.pubsub_build.outputs.digest }}
          CLOUDTASKS_DIGEST: ${{ steps.cloudtasks_build.outputs.digest }}
          BIGTABLE_DIGEST: ${{ steps.bigtable_build.outputs.digest }}
          SPANNER_DIGEST: ${{ steps.spanner_build.outputs.digest }}
          FIRESTORE_DIGEST: ${{ steps.firestore_build.outputs.digest }}
        run: |
          printf 'Application: %s\n\n' "$APPLICATION" >> "$GITHUB_STEP_SUMMARY"
          for image in "$OPERATOR_IMAGE" "$FLINK_IMAGE"; do
            digest="$(crane digest "$image")"
            printf '%s@%s\n\n' "${image%:*}" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          # A step the application input skipped leaves its digest empty.
          published() {
            if [ -n "$2" ]; then printf '%s/%s@%s\n' "$GAR" "$1" "$2"; fi
          }
          {
            published lifecycle-tools "$LIFECYCLE_DIGEST"
            published smoke "$SMOKE_DIGEST"
            published bigquery-recovery "$BIGQUERY_DIGEST"
            published pubsub-recovery "$PUBSUB_DIGEST"
            published cloudtasks-recovery "$CLOUDTASKS_DIGEST"
            published bigtable-recovery "$BIGTABLE_DIGEST"
            published spanner-recovery "$SPANNER_DIGEST"
            published firestore-recovery "$FIRESTORE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
