version: 2

# Minor and patch updates are grouped, major updates are not. A month of
# ungrouped updates arrives as one pull request per dependency — nine at once on
# 2026-08-15 — and each fans out to roughly sixteen jobs, which saturates the
# runner pool: that burst put `verify / Build and test` behind 1213s of queueing
# against 955s of building, measured on issue #453. Grouping collapses the burst
# at its source without touching build time or the surefire fork reuse the
# gated suites depend on.
#
# Major updates stay ungrouped deliberately. They need a judgement per
# dependency, and bundling one into a green group is how it gets merged without
# that judgement.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maven:
        update-types:
          - minor
          - patch
    ignore:
      # flink.version is the supported floor, decided together with the version
      # matrix in .github/workflows/weekly.yaml — moving a minor changes what the
      # project claims to support, so it is a deliberate edit rather than a PR to
      # triage. Patch bumps (2.2.1 -> 2.2.2) still arrive: they stay inside the
      # supported minor and are exactly what dependabot is useful for.
      - dependency-name: org.apache.flink:*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # The test frameworks follow Flink across a major: the root POM imports
      # both BOMs in dependencyManagement, so they set the version of artifacts
      # Flink's own test utilities declare — flink-test-utils-junit 2.2.1
      # declares junit-vintage-engine 5.11.4 and testcontainers 1.21.4, and
      # dependency:tree resolves the vintage engine at our 5.13.3 instead.
      # Ahead inside a major is fine; crossing one moves Flink's declared test
      # dependencies to a major Flink does not build against. Minor and patch
      # bumps still arrive, which is where the value is; the majors are deferred
      # against issues #906 (JUnit) and #905 (testcontainers), each of which
      # names the check that would end the deferral.
      - dependency-name: org.junit:junit-bom
        update-types:
          - version-update:semver-major
      - dependency-name: org.testcontainers:testcontainers-bom
        update-types:
          - version-update:semver-major
      # zstd-jni is pinned to what avro-parent ${avro.version} pins, so the codec
      # and the library it drives are the pair Avro itself tests — the reason is
      # on the property in the root POM. Every update type, because the version
      # should move when avro.version moves and at no other time.
      - dependency-name: com.github.luben:zstd-jni
      # Same rule again: jackson-bom is pinned to what avro-parent ${avro.version}
      # pins, so the Jackson set the shaded bundles ship and the tests run on is
      # the set Avro tests — the reason is on the property in the root POM. Every
      # update type, as for zstd-jni. ADR-0150 records the decision.
      - dependency-name: com.fasterxml.jackson:jackson-bom
      # Same rule, different upstream: the BigQuery module hand-assembles the
      # minimum Hadoop test classpath a COMPRESSED Parquet staging file needs,
      # and these two are pinned to what hadoop-project ${hadoop.version} pins so
      # that classpath resolves what a deployment adding hadoop-common resolves.
      # Every update type — they move when hadoop.version moves, which dependabot
      # is still free to bump. Issue #940 records the decision; the pom comment
      # beside the two dependencies carries the reason.
      - dependency-name: org.apache.commons:commons-collections4
      - dependency-name: org.apache.hadoop.thirdparty:hadoop-shaded-guava
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
  # No group here: docs/go.mod requires exactly one dependency, so a group could
  # never collapse anything and would only rename the pull request.
  - package-ecosystem: gomod
    directory: /docs
    schedule:
      interval: monthly
