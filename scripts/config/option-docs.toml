#
# Which page must document each connector's options (scripts/check-option-docs.py).
#
# Four tables, doing two different jobs. The first two say *where* each surface
# is documented; the last two are the exceptions, and they point in OPPOSITE
# directions — which is the thing to get right when adding one:
#
#   [[builders]]        module     -> page   what must be documented
#     its `sources`     class      -> that page, for a builder the globs miss
#   [[config_options]]  ConfigOption class -> page
#   [exempt]            source side         a setter that exists with no row
#   [extra]             page side           a row that exists with no setter
#
# So: the check failed naming a `Class.setter`? That is coverage, and [exempt]
# is the escape. It failed naming a page and a line? That is staleness, and
# [extra] is — but a corrected row is usually the real answer. Both are
# `key = "reason"`, and the reason says why this is *not* a row, since that is
# what the next person has to re-judge.
#
# `.agents/skills/curate-option-docs/` is the procedure for every failure this
# file can produce, including which of the two an entry belongs in.
#
# Modules are mapped, not individual classes, on purpose: a new *Options class
# added to a module is then required to appear in that module's reference page
# from the moment it exists. Listing classes here instead would let a new one
# through silently, which is the rot this check is for. A module with options
# and no entry here fails for the same reason — see the next connector, since
# Bigtable and Spanner both arrive as new modules.
#
# `sources` is the one exception, and it does not reopen that hole. A public
# builder need not be named for the options it takes — `PubSubDeadLetterQueue`
# is named for what it is — and from the day that class landed nothing checked
# its five knobs in either direction (#328). Naming the class here reaches it;
# what keeps the naming honest is that the script fails on a public builder no
# mapping reaches at all, so a class cannot be invisible the way that one was,
# only listed or deliberately marked `@Internal`.

# Builder options: every public builder setter under the module's main sources
# must be named in the page. Sources are `*Options.java`, `*SinkBuilder.java`
# and `*SourceBuilder.java`, minus anything claimed by [[config_options]], plus
# anything `sources` names.
[[builders]]
module = "flink-connector-gcp-bigquery"
page = "docs/content/docs/reference/bigquery.md"
sources = [
  "flink-connector-gcp-bigquery/src/main/java/io/github/flink/gcp/connector/bigquery/sink/serializer/AdditionalFields.java",
]

[[builders]]
module = "flink-connector-gcp-pubsub"
page = "docs/content/docs/reference/pubsub.md"
# One instance of this queue serves every connector here, but the class is
# Pub/Sub's and publishes to a Pub/Sub topic, so its knobs are documented once
# on this page and the other reference pages link to it.
sources = [
  "flink-connector-gcp-pubsub/src/main/java/io/github/flink/gcp/connector/pubsub/deadletter/PubSubDeadLetterQueue.java",
]

[[builders]]
module = "flink-connector-gcp-cloudtasks"
page = "docs/content/docs/reference/cloudtasks.md"
sources = [
  "flink-connector-gcp-cloudtasks/src/main/java/io/github/flink/gcp/connector/cloudtasks/sink/serializer/AppEngineTargetBuilder.java",
]

[[builders]]
module = "flink-connector-gcp-bigtable"
page = "docs/content/docs/reference/bigtable.md"

[[builders]]
module = "flink-connector-gcp-spanner"
page = "docs/content/docs/reference/spanner.md"

# The Table API surface is real ConfigOptions rather than builder setters, and
# is documented beside the DDL it is used from rather than beside the builders
# it maps onto — the mapping is the thing worth reading there.
[[config_options]]
source = "flink-connector-gcp-pubsub/src/main/java/io/github/flink/gcp/connector/pubsub/table/PubSubConnectorOptions.java"
page = "docs/content/docs/connectors/table/pubsub.md"

[[config_options]]
source = "flink-connector-gcp-cloudtasks/src/main/java/io/github/flink/gcp/connector/cloudtasks/table/CloudTasksConnectorOptions.java"
page = "docs/content/docs/connectors/table/cloudtasks.md"

[[config_options]]
source = "flink-connector-gcp-bigquery/src/main/java/io/github/flink/gcp/connector/bigquery/table/BigQueryConnectorOptions.java"
page = "docs/content/docs/connectors/table/bigquery.md"

[[config_options]]
source = "flink-connector-gcp-bigtable/src/main/java/io/github/flink/gcp/connector/bigtable/table/BigtableConnectorOptions.java"
page = "docs/content/docs/connectors/table/bigtable.md"

[[config_options]]
source = "flink-connector-gcp-spanner/src/main/java/io/github/flink/gcp/connector/spanner/table/SpannerConnectorOptions.java"
page = "docs/content/docs/connectors/table/spanner.md"

# SOURCE SIDE. Setters that exist and deliberately have no row, keyed
# `Class.setter`. The bar is that a reader looking the setter up would find
# nothing new.
#
# Empty, and worth saying why so the same four are not re-added: the bulk
# `Collection<String>` overloads (`jsonFieldPaths`, `geographyFieldPaths` on
# both schema options classes) were listed here at first, and turned out not to
# need it — the pages name them in the same row as their singular, which
# satisfies coverage directly and reads better than an exemption would. The
# check now fails on an entry that never fires, which is how that was found.
[exempt]

# PAGE SIDE. Option-table entries that exist and no mapped source declares,
# keyed by the name exactly as the table writes it. The last resort of the two:
# a row nothing declares is usually a rename that needs correcting or a
# leftover that needs deleting, and only rarely a genuine outside declaration.
#
# All three are Flink's own, from FactoryUtil rather than from
# PubSubConnectorOptions, and the page says so in its opening paragraph. They
# belong in its tables all the same: a reader writing DDL needs every key the
# connector accepts, not only the ones this project happens to declare.
[extra]
"changeTypeProvider" = "Required by CdcOptions.builder(...), not declared as a setter."
"format" = "Declared by Flink's FactoryUtil; the connector requires it but does not define it."
"scan.parallelism" = "As format above."
"sink.parallelism" = "As format above."
"lookup.cache" = "Declared by Flink's LookupOptions and imported unchanged by the table factories."
"lookup.max-retries" = "As lookup.cache above."
"lookup.partial-cache.expire-after-access" = "As lookup.cache above."
"lookup.partial-cache.expire-after-write" = "As lookup.cache above."
"lookup.partial-cache.cache-missing-key" = "As lookup.cache above."
"lookup.partial-cache.max-rows" = "As lookup.cache above."
"lookup.full-cache.reload-strategy" = "As lookup.cache above."
"lookup.full-cache.periodic-reload.interval" = "As lookup.cache above."
"lookup.full-cache.periodic-reload.schedule-mode" = "As lookup.cache above."
"lookup.full-cache.timed-reload.iso-time" = "As lookup.cache above."
"lookup.full-cache.timed-reload.interval-in-days" = "As lookup.cache above."

# NEITHER SIDE. Public builders that build a *value* rather than a
# configuration, keyed by repo-relative path. The third answer to the
# unmapped-public-builder guard, and the narrowest: the other two are "map it to
# a reference page" and "mark the class @Internal", and a published record whose
# builder sets record fields is neither.
#
# A reference row could not exist for these — the reference documents what a job
# configures, and nothing here is configured. Marking them @Internal to satisfy
# the guard would demote a type users receive, which is a stability decision and
# not a documentation one.
[value_builders]
"flink-connector-gcp-spanner/src/main/java/io/github/flink/gcp/connector/spanner/source/changestream/DataChangeRecord.java" = "A @PublicEvolving Change Streams record. Its builder sets the thirteen fields Spanner reports for one data change; none of them is a job option, and the record is what a deserializer receives rather than something a job configures."
