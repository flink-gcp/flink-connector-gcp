# --- unreachable: the four literals no SQL caller can arrive at ---
#
# The only verdict this file asserts on its own authority, so each says what was
# measured. All four were measured on #1027 rather than assumed.

[[sites]]
module = "flink-connector-gcp-bigquery"
class = "AvroSchemaOptions"
member = "jsonFieldPath"
literal = "path"
verdict = "unreachable"
reason = """
No SQL path reaches this setter: nothing in the main tree calls the singular
`jsonFieldPath(String)` at all. The table layer routes `sink.json-field-paths` —
an `.asList()` option Flink splits — into
`RowDataSchemaOptions.Builder.jsonFieldPaths(Collection)`, which does
`json.addAll(paths)` and checks nothing, which is why #1027 measured a blank
value producing no throwable. So `path` answers a DataStream caller only, and it
is the parameter they passed."""

[[sites]]
module = "flink-connector-gcp-bigquery"
class = "AvroSchemaOptions"
member = "geographyFieldPath"
literal = "path"
verdict = "unreachable"
reason = """
`sink.geography-field-paths` through
`RowDataSchemaOptions.Builder.geographyFieldPaths(Collection)`: the same shape,
the same absent check and the same measurement as jsonFieldPath above."""

[[sites]]
module = "flink-connector-gcp-bigquery"
class = "ProtoSchemaOptions"
member = "jsonFieldPath"
literal = "path"
verdict = "unreachable"
reason = """
The proto serializer's counterpart of AvroSchemaOptions.jsonFieldPath. Uncalled
in the main tree for the same reason, and measured with it."""

[[sites]]
module = "flink-connector-gcp-bigquery"
class = "ProtoSchemaOptions"
member = "geographyFieldPath"
literal = "path"
verdict = "unreachable"
reason = """
The proto serializer's counterpart of AvroSchemaOptions.geographyFieldPath.
Uncalled in the main tree for the same reason, and measured with it."""
