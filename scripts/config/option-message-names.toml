#
# Which setting each check that names one is allowed to name (ADR-0127, #1028).
#
# One [[sites]] entry per call to ResourceNames.checkComponent,
# ResourceNames.checkNotBlank or EmulatorEndpoint.parse whose name argument is a
# string literal. The entry is identified by module, class, member and literal,
# and carries one of three verdicts:
#
#   same         the literal IS the DDL key, so the message already names what a
#                SQL caller typed. Held by comparing them; needs no keys.
#   restated     the table layer checks the value again under its own key(s),
#                listed in `keys`. Held by looking for them there.
#   unreachable  no SQL caller reaches this check. `reason` is required, and is
#                the only claim in this file the sources do not settle.
#
# A call site with no entry fails, and an entry with no call site fails. Adding
# an entry is never a way to quieten something: if the check passes without it,
# it has to go.
#
# `.agents/skills/curate-option-message-names/` is the procedure for every
# failure this file can produce, including which verdict an entry belongs under.

# --- same: a resource-path component whose setter name is already the DDL key ---
#
# Every one of these is a `*Destination.of` / `SpannerDatabase.of` component. The
# literal is the parameter's own name, and each connector's DDL spells the same
# option with the same word, so a DataStream caller and a SQL caller are both
# answered in the vocabulary they used. The check is the comparison, not this
# comment: rename either side and the entry fails.

[[sites]]
module = "flink-connector-gcp-bigquery"
class = "TableDestination"
member = "of"
literal = "project"
verdict = "same"

