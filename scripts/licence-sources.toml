# Where each bundled licence text comes from, pinned by sha256. Consumed by
# scripts/check-notice.py: --update fetches/extracts these into the module's
# META-INF/licenses/, the default check verifies the checked-in files still
# hash to the recorded values. A fetch whose content does not match its
# recorded sha256 fails — upstream changed, and a human decides.
#
# Every artifact whose (merged) licence is not Apache-2.0 must appear in
# exactly one entry's artifacts list; check-notice.py fails otherwise, which
# is the prompt to curate a new entry here (see
# .agents/skills/curate-licence-source/ for the fallback ladder). Artifacts
# are named groupId:artifactId, shared across modules and versions — the sha
# pin is what detects an upstream text change, not the version.
#
# `jar` takes the text out of the bundled artifact's own jar (best provenance:
# version-exact, publisher-shipped). `url` fetches over HTTPS; a GITHUB_TOKEN
# env var or `gh auth token` is sent when present, though
# raw.githubusercontent.com needs neither. Each url entry's note says why that
# ref is the right one, because none of the url-sourced artifacts ships its
# licence text in any jar (main jar and sources jar both checked), and several
# POM-declared licence URLs point at HTML pages or bare licence templates
# without the copyright line.
#
# A url is one of exactly two shapes, and check-notice.py rejects any other
# (issue #343):
#   - version-templated: `{version}` marks where the release tag carries the
#     version, and --update fills it with the resolved version of the entry's
#     artifacts — so a dependency bump re-fetches at the new tag with no edit
#     here, and the sha256 pin is what stops a text that changed between tags.
#     `version_strip_prefix` drops a leading segment of the resolved version
#     first, for a tag scheme that does not carry it (protobuf).
#   - `version_independent = true`: the ref never moves (an archived
#     repository's head), declared explicitly because a literal tag-pinned url
#     is exactly the shape that silently survives a version bump.
# verify.yaml re-fetches every entry when a change touches a licence-source
# input, and the weekly notice_sources job does so on schedule — so a pin no
# longer served as recorded is noticed without waiting for a human --update.

[files."LICENSE.protobuf"]
artifacts = [
    "com.google.protobuf:protobuf-java",
    "com.google.protobuf:protobuf-java-util",
]
url = "https://raw.githubusercontent.com/protocolbuffers/protobuf/v{version}/LICENSE"
version_strip_prefix = "4."
sha256 = "6e5e117324afd944dcf67f36cf329843bc1a92229a8cd9bb573d7a83130fea7d"
# The Java artifacts release from the tag named for the C++ line: Java 4.x
# ships from tag v<x> (the Java major is offset by 4), which is what the
# version_strip_prefix encodes. The POM-declared URL is opensource.org, which
# serves an HTML page.

[files."LICENSE.gax"]
artifacts = [
    "com.google.api:api-common",
    "com.google.api:gax",
    "com.google.api:gax-grpc",
    "com.google.api:gax-httpjson",
]
url = "https://raw.githubusercontent.com/googleapis/gax-java/master/LICENSE"
version_independent = true
sha256 = "f3096c48a05a56e6c4f85ea75d4784fe32954768473eae3c33df6714257fbd4d"
# The repository the gax artifacts' POMs declare. Archived, hence frozen —
# which makes it a stable source; no per-version tag exists for these versions
# anywhere fetchable (sdk-platform-java main carries older gax than this BOM
# resolves). api-common's POM declares api-common-java instead, but all four
# artifacts now release from the same consolidated repository and carry the
# same Google BSD-3-Clause text, so they share this file.

[files."LICENSE.google-auth-library"]
artifacts = [
    "com.google.auth:google-auth-library-credentials",
    "com.google.auth:google-auth-library-oauth2-http",
]
url = "https://raw.githubusercontent.com/googleapis/google-auth-library-java/master/LICENSE"
version_independent = true
sha256 = "b42ab23e81b855c025453a25d1f1eab7387839b0fcbb153921fd858cde4a7c53"
# The project's repository, archived and frozen; it has no tag for this
# version (released after the move) and the POM-declared URL is
# opensource.org's HTML page.

[files."LICENSE.re2j"]
artifacts = ["com.google.re2j:re2j"]
url = "https://raw.githubusercontent.com/google/re2j/re2j-{version}/LICENSE"
sha256 = "26a6133577cc8e48d7c002ac4d4a554786e7c0e1732e10f2db205e5e494c411b"
# Release tags are re2j-<version>. The POM-declared URL is golang.org/LICENSE,
# which serves an HTML page.

[files."LICENSE.animal-sniffer"]
artifacts = ["org.codehaus.mojo:animal-sniffer-annotations"]
url = "https://raw.githubusercontent.com/mojohaus/animal-sniffer/animal-sniffer-{version}/LICENSE"
sha256 = "0d17e86dbd1f3504cfa311e67827e1569ad27bbfff29cc405194e4a2549e9df8"
# Release tags are animal-sniffer-<version>. The POM-declared URL is spdx.org's
# bare MIT template, which lacks the copyright line.

[files."LICENSE.threetenbp"]
artifacts = ["org.threeten:threetenbp"]
jar = "META-INF/LICENSE.txt"
sha256 = "f046720e38f8b071dbd0656ded91ad6e9328a4bb48bd50632f185598885b9cdd"
# Shipped inside the artifact's own jar.

[files."LICENSE.checker-qual"]
artifacts = [
    "org.checkerframework:checker-qual",
    "org.checkerframework:checker-compat-qual",
]
jar = "META-INF/LICENSE.txt"
sha256 = "e90eaa08dea089df10f2bf7f9dba63a5f6237c01562c4741e2e86773e78582d5"
# Shipped inside checker-qual's own jar, and shared with checker-compat-qual,
# which ships none: the text is the project's MIT licence for its qualifier
# artifacts ("Checker Framework qualifiers", copyright the Checker Framework
# developers), and both artifacts' POMs declare MIT - compat-qual's own, and
# the project's checkerQualReleasePom.xml at tag checker-framework-2.5.6. The
# version-matched tag was checked and rejected on correctness rather than
# availability: the only licence texts it carries are a GPL2 root LICENSE.txt
# for the framework and an Apache-2.0 maven-artifacts/LICENSE.txt, neither of
# which describes the qual jars.
# Note the order of `artifacts` is load-bearing: a `jar` source extracts from the first one, so
# checker-qual must stay first. If it ever leaves the tree while compat-qual stays, this entry
# needs a `url` source rather than a reorder - compat-qual's jar ships no licence text at all.

[files."LICENSE.threeten-extra"]
artifacts = ["org.threeten:threeten-extra"]
jar = "META-INF/LICENSE.txt"
sha256 = "ff3c303a06b9007bf90c7c2c2acac3afdd2af2b504fad21e8b27c9605e1fbcd4"
# Shipped inside the artifact's own jar. A separate file from
# LICENSE.threetenbp: same authors, same BSD-3-Clause, different copyright
# years, and the years are part of the text.

[files."LICENSE.stax2-api"]
artifacts = ["org.codehaus.woodstox:stax2-api"]
jar = "META-INF/LICENSE"
sha256 = "b3e969d18f690ab8783e4ec77729c9fea85691b8090c550bb3c626dda5e837a7"
# Shipped inside the artifact's own jar, byte-identical to
# src/main/resources/META-INF/LICENSE at tag stax2-api-4.2.2. Note what the
# publisher's file is: a statement that the licence is the 2-clause BSD,
# naming FasterXML.com and 2010- as the holder and year, rather than the
# clause text itself. It is pinned as-is because it is what the publisher
# ships; substituting a template would drop that copyright line, which is
# the part of a BSD licence a redistributor must reproduce.

[files."LICENSE.zstd-jni"]
artifacts = ["com.github.luben:zstd-jni"]
url = "https://raw.githubusercontent.com/luben/zstd-jni/v{version}/LICENSE"
sha256 = "289a6adada5726047b9e68bf607cc44fbbac953bbb4fd29f53ffe75b5cb3e7b1"
# Release tags are v<version>; the jar ships no licence file at all (checked:
# it carries only classes and the per-platform native libraries). The
# POM-declared URL is opensource.org, which serves an HTML page and would in
# any case drop the "Luben Karavelov" copyright line that a BSD licence
# requires a redistributor to reproduce.

[files."LICENSE.json-java"]
artifacts = ["org.json:json"]
url = "https://raw.githubusercontent.com/stleary/JSON-java/{version}/LICENSE"
sha256 = "86cc84f1773e3318ba26fd61b3ae508a167df38b361695e105f6e499e7a2736f"
# Release tags are the bare datestamp version; the jar ships no licence file.
# The whole text is "Public Domain." - the project relinquished the old JSON
# License ("The Software shall be used for Good, not Evil"), whose use
# restriction would have made this dependency a question for the user rather
# than an entry here.
