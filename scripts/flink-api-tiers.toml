# Which unstable Flink API tiers the main sources may depend on, and why.
# Consumed by scripts/check-flink-api-tiers.py (issue #103): every
# `org.apache.flink` type the main sources import is classified by its
# class-level stability annotation, and a type that is @Internal,
# @Experimental or unannotated must have an entry here — with a reason —
# or the check fails. The value is in noticing the next unstable
# dependency when it is added, not in relitigating the ones below.
#
# How to react when the check fails (the judgment ladder lives in
# .claude/skills/curate-flink-api-tier/):
#   - a new type appears in the failure: prefer a stable alternative (for
#     the utility classes, inlining a few lines beats a new entry); if the
#     dependency is genuinely unavoidable, add an entry whose reason says
#     why, the way SplitsRemoval's does. A new @Experimental exposure is a
#     design discussion first, never just an entry
#   - an entry is reported stale: the import is gone, so delete the entry —
#     the list stays an exact record, never a superset
#   - a type resolves to no sources jar: a type moved between Flink
#     artifacts, or a new package family arrived; extend `artifacts` below
#   - an artifact is reported unused: it no longer owns any imported type;
#     remove it from `artifacts`
#
# @Public and @PublicEvolving need no entries: both are supported tiers
# (source-compatible across minors for @Public, within a minor for
# @PublicEvolving), and the connector's compatibility claims are measured
# against them by the weekly binary_compat job, not licensed here.

# The org.apache.flink sources jars that own the imported types, resolved at
# the pom-pinned flink.version (the supported floor). Not flink-streaming-java:
# since the 2.x restructuring the streaming.api.* types this project uses ship
# in flink-runtime's sources jar, and flink-core-api (split out of flink-core
# in 2.0) owns util.function.*. flink-test-utils owns MetricListener, which the
# test-utils module's sink metric-group harness sits on — that module keeps its
# helpers in src/main/java so siblings can consume the plain jar at test scope,
# which is exactly why they are audited here like any other main source.
artifacts = [
    "flink-annotations",
    "flink-core",
    "flink-core-api",
    "flink-metrics-core",
    "flink-runtime",
    "flink-connector-base",
    "flink-table-common",
    "flink-test-utils",
]

# ---------------------------------------------------------------------------
# @Internal — Flink reserves the right to change these in any release.
# ---------------------------------------------------------------------------

[internal."org.apache.flink.annotation.VisibleForTesting"]
reason = """
The annotation itself is @Internal in flink-annotations. Marker only — no
runtime behaviour to break, and dropping it would cost the documentation
value it exists for. Cheap to replace with a comment if it ever moves."""

[internal."org.apache.flink.util.Preconditions"]
reason = """
Argument-checking utility used by every builder and options class. Guava's
Preconditions or a few inlined checks are drop-in replacements if it ever
changes; not worth avoiding until then."""

[internal."org.apache.flink.util.ExceptionUtils"]
reason = """
findThrowable in every writer's error classification (cause-chain walks in
AppendErrorClassifier, PubSubWriter, CloudTasksWriter), plus firstOrSuppressed
and rethrowException in base.lifecycle.Closers, which is what lets a close
failure keep its own type. Small, stable-in-practice utility; inlining the
helpers is the fallback."""

[internal."org.apache.flink.metrics.ThreadSafeSimpleCounter"]
reason = """
The Pub/Sub source reader counts records outside the mailbox thread, and this
is Flink's own thread-safe Counter. The fallback is a trivial
LongAdder-backed Counter implementation in this repository."""

[internal."org.apache.flink.metrics.groups.UnregisteredMetricsGroup"]
reason = """
Only its static createOperatorIOMetricGroup(), for the one method of
SinkWriterMetricGroup the test harness in flink-connector-gcp-test-utils has to
answer and no sink here calls (issue #208). Test-support code, so a change
breaks a test rather than a job, and the fallback is a four-method stub of
OperatorIOMetricGroup in this repository."""

[internal."org.apache.flink.connector.base.source.reader.splitreader.SplitsRemoval"]
reason = """
Part of the SplitReader SPI surface in practice: handleSplitsChanges receives
a SplitsChange, and distinguishing a removal from an addition means naming
the @Internal subtype. Near-unavoidable while implementing the interface —
noted as such on issue #103."""

# ---------------------------------------------------------------------------
# @Experimental — no guarantee even across patch releases. The four entries
# are one coherent surface, not four exposures — carried by two deliberate,
# documented design decisions in the BigQuery sink: the FILE_LOADS pre-commit
# topology (issue #14) and the buffered-stream exactly-once sink's identity
# pre-commit topology used as a validation hook (issue #30). Both are
# recorded in flink-connector-gcp-bigquery/CLAUDE.md and the BigQuery docs
# page.
# ---------------------------------------------------------------------------

[experimental."org.apache.flink.streaming.api.connector.sink2.SupportsPreCommitTopology"]
reason = """
Implemented by both BigQuery 2PC sinks: FILE_LOADS aggregates per-subtask
pending files into load jobs before the committer (issue #14, FileSink's
compactor precedent), and the buffered-stream exactly-once sink uses the
identity topology as its validation hook (issue #30)."""

[experimental."org.apache.flink.streaming.api.connector.sink2.CommittableMessage"]
reason = "Carrier type of the SupportsPreCommitTopology contract; same exposure."

[experimental."org.apache.flink.streaming.api.connector.sink2.CommittableWithLineage"]
reason = "Concrete CommittableMessage the pre-commit topology emits; same exposure."

[experimental."org.apache.flink.streaming.api.connector.sink2.CommittableMessageTypeInfo"]
reason = "TypeInformation for the pre-commit topology stream; same exposure."

# ---------------------------------------------------------------------------
# Unannotated — no tier at all, which is weaker than @Internal, not stronger.
# ---------------------------------------------------------------------------

[unannotated."org.apache.flink.core.memory.DataInputDeserializer"]
reason = """
The Pub/Sub source's split and enumerator-state serializers use Flink's own
byte-order-stable views, a pairing common across Flink connectors'
SimpleVersionedSerializers. Fallback is DataInputStream over a
ByteArrayInputStream — which is what the kafka connector's serializers use."""

[unannotated."org.apache.flink.core.memory.DataOutputSerializer"]
reason = """
Write-side twin of DataInputDeserializer in the same serializers; same
rationale and same fallback."""

[unannotated."org.apache.flink.runtime.metrics.groups.ProxyMetricGroup"]
reason = """
Base class of the sink metric-group test harness in
flink-connector-gcp-test-utils (issue #208): it delegates every registration to
a parent group, which is what lets the harness put a writer's metrics into a
MetricListener and read them back by the names a reporter would see. Flink's own
InternalSinkWriterMetricGroup extends it for the same reason and offers no mock()
factory to use instead. Test-support code, and the fallback is implementing
MetricGroup's dozen delegating methods here."""

[unannotated."org.apache.flink.metrics.testutils.MetricListener"]
reason = """
The registry behind that harness, and Flink's own test utility for the job —
the Pub/Sub source's TestReaderMetrics already uses it, in test sources. It is
named here only because the sink harness is shared and therefore lives in
src/main/java. Fallback is a metric-recording MetricGroup of this repository's
own, which would reimplement Flink's identifier composition — the very thing the
name-based assertions rest on."""
