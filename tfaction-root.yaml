# Global tfaction configuration (https://suzuki-shunsuke.github.io/tfaction/).
# Root modules are the directories carrying a tfaction.yaml — today only
# opentofu/flink-gcp. The plan runs as ci.yaml's tofu_plan job (which calls
# .github/workflows/tofu-plan.yaml); the apply is tofu-apply.yaml.

# ci.yaml, not tofu-plan.yaml, because this names the *run* that owns the plan
# artifact rather than the file the plan steps live in: tfaction passes this
# string as the workflow_id of listWorkflowRuns, and a workflow_call child has
# no runs of its own — its artifacts belong to the caller's run. Naming
# tofu-plan.yaml still resolves to a real workflow, and it has runs, but none
# since it stopped being triggered directly (2026-08-06) and so none on any
# newer pull request's head branch — which is what the branch-filtered lookup
# asks for. That empty result is what the apply reports as "No workflow run is
# found" (issue #444; it cost one merged IAM binding that never reached the
# project).
#
# Two things this keys on, neither of them obvious from the setting's name:
# ci.yaml must stay pull_request-only, because the lookup takes the single
# newest run on the pull request's head branch with no event filter, so any
# other trigger there could hand the apply a run that never planned; and the
# run it finds must carry the pull request's head SHA, which tfaction checks
# before downloading.
plan_workflow_name: ci.yaml

# Not configured because the defaults are what this repository wants, and
# worth knowing about: dismiss_approval_before_plan is enabled by default —
# a re-plan dismisses stale approvals, so what was approved is always the
# plan that will apply.

terraform_command: tofu

# Enforced by the `test` action's check-providers step, which runs in
# tofu-plan.yaml: a provider the configuration resolves but this list omits
# fails the check. tofu resolves the short `hashicorp/google` source against
# its own registry, as the committed .terraform.lock.hcl records.
available_providers:
  - name: registry.opentofu.org/hashicorp/google

# Every pull request tfaction opens arrives as a draft, matching this
# repository's draft-first flow. In practice that means the follow-up pull
# request after a failed apply — the only one it creates here.
draft_pr: true

# The `test` action's two linters, both on their defaults except that trivy is
# off. tflint is clean against this configuration and stays enforced; `fix`
# lets it push the correction rather than only report it, which is what the
# App token is for (ADR-0121).
tflint:
  enabled: true
  fix: true

# Off against a measurement: tfaction throws on any trivy finding at all, and
# this configuration already has five. opentofu/README.md's decisions table
# names them and prices the alternative.
trivy:
  enabled: false

target_groups:
  # A glob, not a prefix: "opentofu/" matches nothing (the first plan run
  # failed on it), and each root module under opentofu/ must match.
  - working_directory: "opentofu/*"
    # Separate accounts per job: the plan one is read-only on the project
    # (plus state-lock writes), the apply one holds the managing roles. Both
    # are assumable only through WIF — no keys exist. The accounts, the pool
    # and their bindings are managed by this very configuration
    # (opentofu/flink-gcp/opentofu-sa.tf, wif.tf).
    terraform_plan_config:
      gcp_service_account: opentofu-plan@flink-gcp.iam.gserviceaccount.com
      gcp_workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
    terraform_apply_config:
      gcp_service_account: opentofu@flink-gcp.iam.gserviceaccount.com
      gcp_workload_identity_provider: projects/639248282241/locations/global/workloadIdentityPools/github/providers/github-actions
