#
# The uv project behind `just test-scripts` (decided with the owner on PR
# #247): dependency management for the scripts/tests suite and pytest
# configuration, nothing more, at the repository root where uv expects a
# project. The layout is not a Python package's: most code under test lives in
# scripts/ as executables that are never importable, standard-library-only but
# for check-skill-frontmatter.py, which declares PyYAML in PEP 723 metadata of
# its own (hence the dev-group pyyaml below: the suite loads it by path).
# The App Engine fixture is also loaded by path, so this project is never
# packaged (`package = false`); `testpaths` below is the one layout
# customisation that needs saying. pytest's constraint is deliberately loose
# (owner's call): uv.lock pins the version actually installed, and an
# upgrade is an explicit `uv lock --upgrade`, so a tight constraint here
# would only duplicate the lockfile's job.

[project]
name = "flink-connector-gcp"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
# pyyaml is a *test* dependency, not the project's: check-skill-frontmatter.py
# declares it in PEP 723 metadata of its own and runs through
# `uv run --no-project`, but the suite loads that script by file path, so the
# import has to resolve here too. Nothing else in scripts/ needs it.
dev = [
    "pytest>=9",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
