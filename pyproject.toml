#
# The non-packaged root manages repository checks and workspace tests.
# Tier-3 owns its runtime dependencies and CLI in tools/tier3.

[project]
name = "flink-connector-gcp"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    # 0.26.0 has a Point getter reference-counting regression. The fix is on
    # upstream's master branch but has not been released, so keep the bound:
    # https://github.com/tree-sitter/py-tree-sitter/issues/472
    # https://github.com/tree-sitter/py-tree-sitter/pull/466
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-java>=0.23.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/tier3"]

[tool.uv.sources]
flink-tier3 = { workspace = true }

[dependency-groups]
dev = ["pytest>=9", "pyyaml==6.0.3", "flink-tier3"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "tools/tier3/tests"]
