# ApiDocsURL under [params] repeats this path; the two move together.
baseURL = "https://laughingman7743.github.io/flink-connector-gcp/"
locale = "en-us"
title = "GCP Connectors for Apache Flink"

# The content tree mirrors the layout of Flink's externalized connector
# repositories (docs/content/docs/connectors/datastream/<connector>.md) so the
# pages stay portable if this project is ever donated to the ASF.
[markup]
  # Emit CSS classes instead of inlining one fixed colour scheme into every code
  # block; the light/dark palettes are selected in assets/_custom.scss so code
  # follows the page theme.
  [markup.highlight]
    noClasses = false

# hugo-book is pulled in as a Hugo module; the version is pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  # Everything hugo-book already defaults to (BookSection, BookToC, BookSearch)
  # is left unset; only genuine departures are listed. The theme's own default
  # is a light theme, so "auto" is a real choice.
  BookTheme = "auto"
  BookRepo = "https://github.com/laughingman7743/flink-connector-gcp"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'

  # The generated API reference (#88). `just docs-javadoc` writes it to
  # docs/static/api/java, which Hugo copies into the site — so it is part of
  # this site, but not Hugo *content*, and `relref` reaches content only. Hence
  # a written-out path, which repeats baseURL's above: the two must move
  # together, and nothing detects it if they do not.
  #
  # Site-relative rather than the absolute Pages URL so that the links work in
  # `just docs-serve` too: hugo serve keeps baseURL's path (measured — it binds
  # at /flink-connector-gcp/, and /api/java/ alone is a 404), so this one value
  # is right in both. An absolute URL would send a local reader to the published
  # site, which does not exist until #93.
  #
  # Deliberately not named Book*, unlike the entries above: that prefix belongs
  # to hugo-book's own parameters, and a name added there later would collide
  # silently.
  ApiDocsURL = "/flink-connector-gcp/api/java/"
