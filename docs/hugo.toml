baseURL = "https://flink-gcp.github.io/flink-connector-gcp/"
locale = "en-us"
title = "GCP Connectors for Apache Flink"

# The content tree mirrors the layout of Flink's externalized connector
# repositories (docs/content/docs/connectors/datastream/<connector>.md) so the
# pages stay portable if this project is ever donated to the ASF.
[markup]
  # Emit CSS classes instead of inlining one fixed colour scheme into every code
  # block; the shared module selects the light/dark palettes so code
  # follows the page theme.
  [markup.highlight]
    noClasses = false

# The shared design module and its Hugo Book dependency are pinned through go.mod.
[module]
  # Sub-target mounts replace the default assets mount for this component.
  # Retain local assets for site-specific extensions; the design module mounts its own assets.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../flink-connector-gcp-docs-validation/src/test/java/io/github/flink/gcp/connector/docs"
    target = "assets/java-snippets"
  [[module.mounts]]
    source = "../flink-connector-gcp-docs-validation/src/test/resources/sql-snippets"
    target = "assets/sql-snippets/flink"
  [[module.mounts]]
    source = "../flink-connector-gcp-spanner/src/test/resources/sql-snippets"
    target = "assets/sql-snippets/spanner"

  [[module.imports]]
    path = "github.com/flink-gcp/flink-gcp-dev-tools/hugo"

[params]
  # A generic code-block render hook rejects raw SQL fences under these paths. Source-backed
  # sql-snippet shortcodes call transform.Highlight directly and therefore remain renderable.
  SourceBackedSqlPaths = ["/docs/examples", "/docs/quickstart", "/docs/connectors/table"]

  # The shared module supplies BookTheme = "auto"; other Hugo Book defaults remain unset.

  # Reaches further than its name suggests: BookEditLink below builds every
  # "Edit this page" target from it, and sixteen content pages build their issue
  # links as `{{< param BookRepo >}}/issues/N`. All of those pointed at the
  # pre-transfer owner until #727 — resolving, because GitHub redirects a moved
  # repository, but sending a reader who inspects the link to an address this
  # project no longer claims.
  BookRepo = "https://github.com/flink-gcp/flink-connector-gcp"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'
