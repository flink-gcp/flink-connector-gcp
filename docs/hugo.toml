# ApiDocsURL under [params] repeats this path; the two move together. Only the
# host moved when the repository was transferred to the flink-gcp org (#727),
# so the path below is unchanged — GitHub Pages derives it from the repository
# name, which the transfer kept.
baseURL = "https://flink-gcp.github.io/flink-connector-gcp/"
locale = "en-us"
title = "GCP Connectors for Apache Flink"

# The content tree mirrors the layout of Flink's externalized connector
# repositories (docs/content/docs/connectors/datastream/<connector>.md) so the
# pages stay portable if this project is ever donated to the ASF.
[markup]
  # Emit CSS classes instead of inlining one fixed colour scheme into every code
  # block; the light/dark palettes are selected in assets/_custom.scss so code
  # follows the page theme.
  [markup.highlight]
    noClasses = false

# hugo-book is pulled in as a Hugo module; the version is pinned in go.mod.
[module]
  # Defining another assets mount replaces the default assets mount for this
  # component, so keep the site's own SCSS explicit beside the Java sources.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../flink-connector-gcp-docs-validation/src/test/java/io/github/flink/gcp/connector/docs"
    target = "assets/java-snippets"
  [[module.mounts]]
    source = "../flink-connector-gcp-docs-validation/src/test/resources/sql-snippets"
    target = "assets/sql-snippets/flink"
  [[module.mounts]]
    source = "../flink-connector-gcp-spanner/src/test/resources/sql-snippets"
    target = "assets/sql-snippets/spanner"

  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  # A generic code-block render hook rejects raw SQL fences under these paths. Source-backed
  # sql-snippet shortcodes call transform.Highlight directly and therefore remain renderable.
  SourceBackedSqlPaths = ["/docs/examples", "/docs/quickstart", "/docs/connectors/table"]

  # Everything hugo-book already defaults to (BookSection, BookToC, BookSearch)
  # is left unset; only genuine departures are listed. The theme's own default
  # is a light theme, so "auto" is a real choice.
  BookTheme = "auto"
  # Reaches further than its name suggests: BookEditLink below builds every
  # "Edit this page" target from it, and sixteen content pages build their issue
  # links as `{{< param BookRepo >}}/issues/N`. All of those pointed at the
  # pre-transfer owner until #727 — resolving, because GitHub redirects a moved
  # repository, but sending a reader who inspects the link to an address this
  # project no longer claims.
  BookRepo = "https://github.com/flink-gcp/flink-connector-gcp"
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'

  # The generated API reference (#88). `just docs-javadoc` writes it to
  # docs/static/api/java, which Hugo copies into the site — so it is part of
  # this site, but not Hugo *content*, and `relref` reaches content only. Hence
  # a written-out path, which repeats baseURL's above: the two must move
  # together, and nothing detects it if they do not.
  #
  # Site-relative rather than the absolute Pages URL so that the links work in
  # `just docs-serve` too: hugo serve keeps baseURL's path (measured — it binds
  # at /flink-connector-gcp/, and /api/java/ alone is a 404), so this one value
  # is right in both. An absolute URL would send a local reader to the published
  # site instead of the one they are previewing.
  #
  # Deliberately not named Book*, unlike the entries above: that prefix belongs
  # to hugo-book's own parameters, and a name added there later would collide
  # silently.
  ApiDocsURL = "/flink-connector-gcp/api/java/"
