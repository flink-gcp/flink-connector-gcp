title = "java-snippet shortcode fixtures"
disableKinds = ["404", "home", "RSS", "robotsTXT", "section", "sitemap", "taxonomy", "term"]

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  # Exercise the repository shortcode itself. The fixture tree deliberately
  # contains no copy of its parsing or validation template.
  [[module.mounts]]
    source = "../../../layouts/_shortcodes"
    target = "layouts/_shortcodes"
  [[module.mounts]]
    source = "../../../layouts/_partials"
    target = "layouts/_partials"
