title = "sql-snippet shortcode fixtures"
disableKinds = ["404", "home", "RSS", "robotsTXT", "section", "sitemap", "taxonomy", "term"]

[params]
  SourceBackedSqlPaths = ["/fixture", "/docs/connectors/table"]

[markup]
  [markup.highlight]
    noClasses = false

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "../../../layouts/_shortcodes"
    target = "layouts/_shortcodes"
  [[module.mounts]]
    source = "../../../layouts/_partials"
    target = "layouts/_partials"
  [[module.mounts]]
    source = "../../../layouts/_markup"
    target = "layouts/_markup"
