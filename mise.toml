[tools]
java = "temurin-17"
maven = "latest"
# Documentation site (docs/). hugo-book requires Hugo extended >= 0.158.0, and
# Hugo needs Go to resolve the theme as a Hugo module.
hugo-extended = "0.164.0"
go = "1.26"
# Lints scripts/. Pinned rather than taken from the runner image, which carries
# 0.9.0 on ubuntu-24.04 and 0.11.0 on 26.04 — when ubuntu-latest migrates, the
# newer release's added checks would fail a pull request that changed nothing.
# CI installs this exact version from here (.github/workflows/lint.yaml), so
# there is no second place to update.
shellcheck = "0.11.0"
# Lints .github/workflows/. Exactly pinned for the same reason as shellcheck: a
# linter that gains a check fails a pull request that changed nothing. It also
# shells out to shellcheck for inline `run:` blocks, which is why the lint
# recipe hands it an explicit path instead of trusting PATH — the runner image
# carries its own shellcheck, and it is not this one.
actionlint = "1.7.12"
# Lints scripts/*.py. Exactly pinned for the same reason as the two above: a
# linter that gains a rule fails a pull request that changed nothing.
ruff = "0.16.0"
# scripts/check-notice.py and scripts/check-flink-api-tiers.py are
# standard-library only bar check-skill-frontmatter.py, whose PyYAML comes from
# its own PEP 723 header; and that standard library must be 3.11+: tomllib
# reads their scripts/*.toml configs. A major.minor pin, not exact — the
# requirement is the module’s presence, and a patch release cannot fail a
# pull request. CI does not use this entry: the ci.yaml jobs that run a
# tomllib script install their own with actions/setup-python (the changes
# job's deriver deliberately runs on the runner image's python3 instead), so
# mise stays out of the setup-java job.
python = "3.12"
# Runs the scripts/tests suite through the root pyproject.toml (`just
# test-scripts`). uv itself is pinned exactly like the linters — a runner that
# changes resolution behaviour must not fail an unchanged pull request — while
# pytest's version lives in uv.lock, which is the lockfile's job.
uv = "0.12.1"
# Lints the rendered markdown (docs/content/ and the READMEs; scope and the
# rule deviations live in .markdownlint-cli2.jsonc). Exactly pinned for the
# same reason as shellcheck: a release that gains a rule (MD060 arrived this
# way) would fail a pull request that changed nothing. The npm backend rides
# the node entry below.
"npm:markdownlint-cli2" = "0.23.2"
# Runtime for the npm backend above — nothing else here uses node. Pinned to a
# major: markdownlint-cli2's behavior is its own version's, and a node patch
# cannot add a lint rule.
node = "24"
# Runs the opentofu/ configuration (locally via `just tofu` and `just lint`,
# in CI via the tofu-plan/tofu-apply workflows). Exactly pinned, and
# versions.tf's required_version repeats it, so a skew between local and CI is
# a loud error — a bump edits both lines together.
opentofu = "1.12.5"
# Lints the opentofu/ configuration, in `just lint` and again in CI through
# tfaction's `test` action, which invokes it as a plain PATH command — so this
# pin is what both get. Being in `just lint` is what makes a tflint finding
# reproducible locally: the CI copy can only *fix* what `--fix` fixes, and
# anything else leaves a red plan job with no commit to read. Exactly pinned for
# the shellcheck reason — a release that gains a rule would fail a pull request
# that changed nothing, and here it would do so by pushing a commit.
tflint = "0.64.0"
# Task runner (justfile). A major-version specifier rather than an exact pin,
# unlike shellcheck above: just guarantees that no 1.x release breaks an
# existing justfile or a working command line, and that there will never be a
# 2.0 — so a newer release cannot fail a pull request that changed nothing,
# which is the whole reason shellcheck is pinned. CI installs it with
# taiki-e/install-action, which takes no version file, and "any 1.x" is what
# both sides then mean.
just = "1"
# Pins GitHub Actions to commit SHAs (`just pin-actions`). Declared here because
# the justfile names it, so `mise install` gives a checkout that can run every
# recipe — `mise x pinact` worked without this, but silently against whatever
# release was newest that day. A major-version specifier, and it stays one now
# that pinact.yaml runs the same tool in CI: the workflow does not read this
# entry at all — pinact-action carries its own pinact, and the pinned v3.0.0
# carries a 4.x — so what this line has to match is that major, not an exact
# release. A newer 4.x on either side pins to the same commit SHAs.
pinact = "4"

[env]
# Local, uncommitted settings — e.g. credentials and BQ_IT_* variables for the
# real-GCP integration tests (see the BigQuery connector documentation under
# docs/content/docs/connectors/datastream/bigquery.md) and the OpenTofu
# credential variables (see opentofu/README.md).
_.file = { path = ".env", redact = true }
