[tools]
java = "temurin-17"
maven = "latest"
# Documentation site (docs/). hugo-book requires Hugo extended >= 0.158.0, and
# Hugo needs Go to resolve the theme as a Hugo module.
hugo-extended = "0.164.0"
go = "1.26"
# Lints scripts/. Pinned rather than taken from the runner image, which carries
# 0.9.0 on ubuntu-24.04 and 0.11.0 on 26.04 — when ubuntu-latest migrates, the
# newer release's added checks would fail a pull request that changed nothing.
# CI installs this exact version from here (.github/workflows/lint.yaml), so
# there is no second place to update.
shellcheck = "0.11.0"
# Lints .github/workflows/. Exactly pinned for the same reason as shellcheck: a
# linter that gains a check fails a pull request that changed nothing. It also
# shells out to shellcheck for inline `run:` blocks, which is why the lint
# recipe hands it an explicit path instead of trusting PATH — the runner image
# carries its own shellcheck, and it is not this one.
actionlint = "1.7.12"
# Task runner (justfile). A major-version specifier rather than an exact pin,
# unlike shellcheck above: just guarantees that no 1.x release breaks an
# existing justfile or a working command line, and that there will never be a
# 2.0 — so a newer release cannot fail a pull request that changed nothing,
# which is the whole reason shellcheck is pinned. CI installs it with
# taiki-e/install-action, which takes no version file, and "any 1.x" is what
# both sides then mean.
just = "1"
# Pins GitHub Actions to commit SHAs (`just pin-actions`). Declared here because
# the justfile names it, so `mise install` gives a checkout that can run every
# recipe — `mise x pinact` worked without this, but silently against whatever
# release was newest that day. A major-version specifier: nothing in CI runs
# pinact, so a newer release cannot fail a pull request, and the worst a change
# in its output does is show up as a diff the author is already reading.
pinact = "4"

[env]
# Local, uncommitted settings — e.g. credentials and BQ_IT_* variables for the
# real-GCP integration tests (see the BigQuery connector documentation under
# docs/content/docs/connectors/datastream/bigquery.md).
_.file = { path = ".env", redact = true }
