# Without a configuration file log4j2 falls back to ERROR, which is what left issue 244's CI
# failure with nothing to read: PubSubSplitReader's "Opening a Pub/Sub subscriber for split ..."
# is what dates each streaming pull against the client library's own keepalive lines, and it was
# suppressed. Same shape as the BigQuery module's file.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %c{1} [%t] %m%n

logger.gcp.name = io.github.flink.gcp.connector
logger.gcp.level = INFO
