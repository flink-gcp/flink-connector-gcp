// Row shapes for FileLoadsWriterRecordCostProbe: a nested event with 120
// repeated sub-messages, about 9.5 KB serialized, and a one-field record.

syntax = "proto3";

package benchmark;

import "google/protobuf/timestamp.proto";

option java_package = "io.github.flink.gcp.connector.bigquery.testproto.benchmark";
option java_multiple_files = true;
option java_outer_classname = "BenchmarkSchemas";

message BenchmarkItem {
  string sku = 1;
  int64 quantity = 2;
  double price = 3;
  string label = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message BenchmarkMeta {
  string region = 1;
  string device = 2;
  int64 sequence = 3;
}

message BenchmarkEvent {
  string id = 1;
  google.protobuf.Timestamp event_time = 2;
  string kind = 3;
  BenchmarkMeta meta = 4;
  repeated BenchmarkItem items = 5;
}

message BenchmarkSingle {
  string id = 1;
}
