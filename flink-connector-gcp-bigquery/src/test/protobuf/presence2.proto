syntax = "proto2";

package presence2;

option java_package = "io.github.flink.gcp.connector.bigquery.testproto";
option java_multiple_files = true;

// proto2, where every singular field has presence — including a `required` one,
// which is the case a presence test alone gets wrong: it has presence and is
// mandatory all the same.
message Proto2Presence {
  required string q_required = 1;
  optional string q_optional = 2;
  required Proto2Child q_required_child = 3;
  optional Proto2Child q_optional_child = 4;
  repeated string q_rep = 5;
}

message Proto2Child {
  optional string c_optional = 1;
}
