syntax = "proto2";

package wellknown2;

import "google/protobuf/wrappers.proto";

option java_package = "io.github.flink.gcp.connector.bigquery.testproto";
option java_multiple_files = true;

// The one documented deviation from "a well-known type column is always
// NULLABLE": a proto2 `required` wrapper derives REQUIRED, because it *is*
// mandatory. The rule is stated in three places and would otherwise be pinned
// nowhere — and the optional sibling beside it is what shows the deviation is
// about `required` and not about proto2.
message Proto2WellKnownTypes {
  required google.protobuf.Int64Value r_required = 1;
  optional google.protobuf.Int64Value r_optional = 2;
}
