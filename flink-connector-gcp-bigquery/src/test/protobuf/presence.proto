syntax = "proto3";

package presence;

option java_package = "io.github.flink.gcp.connector.bigquery.testproto";
option java_multiple_files = true;

// Every shape a proto3 field can take with respect to presence, which is what
// decides a derived BigQuery column's mode.
//
// Writing this by hand as a FileDescriptorProto is what motivated the codegen:
// a proto3 `optional` field is only valid as the sole member of a synthetic
// one-field oneof named `_<field>`, declared after every real oneof, with
// proto3_optional set — protoc gets that right, and protobuf-java enforces only
// the ordering half of it, so a hand-built fixture can be wrong in ways nothing
// catches.
message Presence {
  // No presence: an unset value is indistinguishable from the type default and
  // reaches the column as 0 / "" / the first enum value, never as NULL.
  string p_implicit = 1;
  int64 p_implicit_int = 2;

  // Presence, from the containing oneof.
  oneof choice {
    string p_choice_a = 3;
    int64 p_choice_b = 4;
  }

  // Presence, explicitly restored by the optional keyword.
  optional string p_optional = 5;

  // A singular message field has presence in either syntax.
  PresenceChild p_nested = 6;

  // Repeated fields have no presence either, so the mode decision has to test
  // repeated first.
  repeated string p_rep = 7;
}

message PresenceChild {
  string c_implicit = 1;
  optional string c_optional = 2;
}
