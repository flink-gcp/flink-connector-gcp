#
# Calibration session for issue #1246 on Flink 2.2.1, preregistered in
# docs/adr/evidence/0162-cloudtasks-assessment-1246.md. Reviewing this file
# authorizes nothing: a dispatch still needs the session approval phrase, a
# published application digest and the owner's numeric approval.
# k01-k06 measure source pacing at rising offered rates; k03 injects the
# 100 ms serialization delay the analysis must detect; k07 pairs k04 without
# CSV output; k09 and k10 exercise the staged gauges and the random-name
# control; interrupt-control-k11 loses its TaskManager after warm-up to
# prove the incomplete-evidence path.
#
# The campaign is the attempt, not the question. `calibration-1246` was spent
# on 2026-09-19: run `cal1246-221-20260920g` executed k01 to k05 and recorded
# them `completed`, and the ledger refuses a completed cell so that evidence
# cannot be silently replaced. Every cell of that attempt reconciled `invalid`
# on one receipt field, so it measured the instrument rather than the service,
# and this attempt starts a fresh ledger.

campaign = "calibration-1246b"

[[cells]]
id = "k01-pace-10"
arm = "UNNAMED"
body_bytes = 1024
parallelism = 1
concurrency = 1
checkpoint_seconds = 1
channel_pool_size = 1
distribution = "even"
offered_rate = 10
warmup_seconds = 60
observation_seconds = 180
control_delay_millis = 0
emit_attempts = true
