# One of the six reactive-mode trials of #2054, each kind with restore
# deduplication off and on, on the DataStream entry point with 10,000
# records per subscription: 20,000 input messages.

version = 6
trial = "reactive-scale-out"
entry_point = "datastream"
records_per_subscription = 10000
restore_deduplication = false
