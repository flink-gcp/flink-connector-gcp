# One of the four recovery trials #1361 runs once each on the DataStream
# entry point. Its input limits are exactly the input domain, 2,000 messages
# of at most 128 bytes; the other traffic limits are the helper ceilings.

version = 4
trial = "jm-replacement"
entry_point = "datastream"
records_per_subscription = 1000

[traffic_limits]
publish_calls = 20000
pull_calls = 2000
input_messages = 2000
input_bytes = 256000
output_messages = 200000
pubsub_requests = 30000
evidence_bytes = 67108864
